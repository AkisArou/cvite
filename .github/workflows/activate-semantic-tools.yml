name: Activate and verify semantic tooling

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cvite-semantic-tooling
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'bootstrap/m0-runtime'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Apply semantic cache and restart integration
        shell: bash
        run: |
          set -euo pipefail
          python3 .cvite/apply-semantic-cache-transaction.py
          python3 .cvite/apply-layout-restart.py
          git diff --check

      - name: Install build toolchains
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          ninja-build
          gcc
          g++
          clang-18
          llvm-18
          llvm-18-dev
          libclang-18-dev
          python3
          cmake

      - name: Verify GCC runtime build
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-gcc -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc \
            -DCVITE_WARNINGS_AS_ERRORS=ON
          cmake --build build-gcc --verbose
          ctest --test-dir build-gcc --output-on-failure

      - name: Verify Clang runtime build
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-clang -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCVITE_WARNINGS_AS_ERRORS=ON
          cmake --build build-clang --verbose
          ctest --test-dir build-clang --output-on-failure

      - name: Verify ASan and UBSan
        shell: bash
        run: |
          set -euo pipefail
          CFLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
          LDFLAGS='-fsanitize=address,undefined' \
          cmake -S . -B build-sanitize -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCVITE_WARNINGS_AS_ERRORS=ON
          cmake --build build-sanitize --verbose
          ASAN_OPTIONS=detect_leaks=1:strict_string_checks=1 \
          UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
          ctest --test-dir build-sanitize --output-on-failure

      - name: Verify full semantic and LLVM pipeline
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-llvm -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCVITE_BUILD_COMPILER=ON \
            -DCVITE_BUILD_LLVM_PASS=ON \
            -DCVITE_BUILD_ORC_LOADER=ON \
            -DCVITE_LIBCLANG_ROOT=/usr/lib/llvm-18 \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DCVITE_WARNINGS_AS_ERRORS=ON
          cmake --build build-llvm --verbose
          ctest --test-dir build-llvm --output-on-failure

      - name: Commit verified semantic integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- \
            CMakeLists.txt \
            cmake/CViteExperimental.cmake \
            src/cli/native_link.cpp \
            src/cli/run.c \
            src/cli/run_internal.h \
            src/cli/semantic_cache.cpp \
            src/cli/semantic_cache.h \
            src/cli/toolchain.c \
            src/cli/watcher.c \
            tests/test_runtime_stress.c

          git rm --ignore-unmatch -- \
            .cvite/apply-semantic-cache-transaction.py \
            .cvite/apply-layout-restart.py \
            .github/workflows/activate-semantic-tools.yml \
            .github/workflows/diagnose-semantic-tools.yml \
            .github/workflows/snapshot-next-milestone.yml

          git diff --cached --check
          git commit -m 'feat: make semantic layout failures transactional and restart-safe'
          git push origin HEAD:bootstrap/m0-runtime
