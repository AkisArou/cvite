name: Report managed pipeline status

on:
  push:
    branches:
      - bootstrap/m0-runtime

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cvite-managed-status-report
  cancel-in-progress: true

jobs:
  report:
    if: >-
      github.actor != 'github-actions[bot]' &&
      contains(github.event.head_commit.message, '[report-managed-status]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Build exact status report
        shell: bash
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          subject=$(git log -1 --format=%s)
          {
            echo '## CVite managed-pipeline checkpoint'
            echo
            echo "- Branch head: \`$head\`"
            echo "- Head subject: \`$subject\`"
            echo
            echo '### Source markers'
            for path in \
              include/cvite/managed_memory.h \
              src/runtime/managed_memory.c \
              include/cvite/allocation_index.hpp \
              src/compiler/allocation_index.cpp \
              src/compiler/allocation_annotator.cpp \
              src/compiler/clang_wrapper.cpp \
              src/transform/managed_baseline_registration_pass.h \
              docs/development-status.md; do
              if test -f "$path"; then
                echo "- ✅ \`$path\`"
              else
                echo "- ❌ \`$path\`"
              fi
            done
            echo
            echo '### Remaining staged directories'
            staged=$(find .github -mindepth 1 -maxdepth 1 -type d -name '*next*' -printf '%f\n' | sort || true)
            if test -n "$staged"; then
              while IFS= read -r path; do echo "- \`.github/$path\`"; done <<< "$staged"
            else
              echo '- none'
            fi
            echo
            echo '### Active workflow files'
            find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort \
              | while IFS= read -r path; do echo "- \`$path\`"; done
          } > /tmp/cvite-managed-status.md
          cat /tmp/cvite-managed-status.md

      - name: Post checkpoint to draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api repos/AkisArou/cvite/issues/1/comments
          --method POST
          --raw-field body="$(cat /tmp/cvite-managed-status.md)"
          >/dev/null

      - name: Remove the one-shot probe
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- .github/workflows/report-managed-pipeline-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- .github/workflows/report-managed-pipeline-status.yml
          git commit -m "ci: remove managed pipeline status probe [skip-managed-consolidation]"
          git fetch origin bootstrap/m0-runtime
          git rebase origin/bootstrap/m0-runtime
          git push origin HEAD:bootstrap/m0-runtime
