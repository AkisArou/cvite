name: Apply refresh diagnostics

on:
  push:
    branches:
      - bootstrap/m0-runtime
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Apply diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 .cvite/apply-refresh-diagnostics.py
          rm -- .cvite/apply-refresh-diagnostics.py
          rm -- .github/workflows/apply-refresh-diagnostics.yml
          git diff --check

      - name: Install Clang and LLVM 18
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          ninja-build
          clang-18
          llvm-18
          llvm-18-dev
          libclang-18-dev
          python3

      - name: Configure
        run: >-
          cmake -S . -B build-diagnostics -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCVITE_BUILD_COMPILER=ON
          -DCVITE_BUILD_LLVM_PASS=ON
          -DCVITE_BUILD_ORC_LOADER=ON
          -DCVITE_LIBCLANG_ROOT=/usr/lib/llvm-18
          -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          -DCVITE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build-diagnostics --verbose

      - name: Test
        run: ctest --test-dir build-diagnostics --output-on-failure

      - name: Commit verified diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            CMakeLists.txt \
            src/host/host_runtime.c \
            src/host/orc_loader.cpp \
            tests/check_constructor_restart.py \
            tests/fixtures/constructor_restart.c \
            docs/candidate-objects.md
          git rm --cached --ignore-unmatch \
            .cvite/apply-refresh-diagnostics.py \
            .github/workflows/apply-refresh-diagnostics.yml
          git diff --cached --check
          git commit -m "feat: explain pinned generations and constructor restarts"
          git push origin HEAD:bootstrap/m0-runtime
