name: Apply scoped CVite implementation patch

on:
  push:
    branches:
      - bootstrap/m0-runtime
    paths:
      - .cvite/compile-db-patch.tar.gz.b64

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Apply and publish scoped patch
        shell: bash
        run: |
          set -euo pipefail
          archive=.cvite/compile-db-patch.tar.gz.b64
          if [[ ! -f "$archive" ]]; then
            echo "Patch archive already consumed."
            exit 0
          fi

          base64 --decode "$archive" > /tmp/cvite-compile-db-patch.tar.gz
          echo "a9d1432a8064c56e4f4200d2da092c6e3e8fc2a72b94a1216ea2e582ab34fe4e  /tmp/cvite-compile-db-patch.tar.gz" | sha256sum --check
          tar -xzf /tmp/cvite-compile-db-patch.tar.gz -C .
          rm -- "$archive"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            CMakeLists.txt \
            docs/dev-server.md \
            src/cli/compile_database.c \
            src/cli/run.c \
            src/cli/run_internal.h \
            src/cli/toolchain.c \
            src/cli/watcher.c \
            src/cli/watch_dependencies.inc \
            tests/check_run.py \
            tests/fixtures/run_app.c \
            .cvite/compile-db-patch.tar.gz.b64
          git diff --cached --check
          git commit -m "feat: ingest compile_commands for live builds"
          git push origin HEAD:bootstrap/m0-runtime
