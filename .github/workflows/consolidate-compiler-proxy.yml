name: Consolidate transparent compiler proxy

on:
  push:
    branches:
      - bootstrap/m0-runtime
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cvite-consolidate-lifecycle
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Apply all pending source layers
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            .cvite/apply-filter-reclaim.py \
            .cvite/apply-safety-boundaries.py \
            .cvite/apply-refresh-diagnostics.py \
            .github/next/apply-semantic-next.py \
            .github/next/apply-semantic-fixes.py \
            .github/managed-next/apply-managed-memory.py \
            .github/allocation-next/apply-allocation-index.py \
            .github/instrumentation-next/apply-managed-instrumentation.py \
            .github/driver-next/apply-compiler-proxy.py
          do
            if [[ -f "$script" ]]; then
              echo "Applying $script"
              python3 "$script"
            fi
          done
          git diff --check

      - name: Require complete invisible pipeline
        shell: bash
        run: |
          set -euo pipefail
          test -f src/compiler/clang_wrapper.cpp
          test -f src/compiler/allocation_annotator.cpp
          test -f src/transform/managed_allocation_pass.cpp
          test -f src/host/managed_host.c
          test -f tests/check_clang_wrapper.py
          grep -q 'CViteCompilerProxy.cmake' CMakeLists.txt
          grep -q 'cviteAppendManagedAllocationPass' src/transform/lowering_pass.cpp

      - name: Install pinned toolchain
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          ninja-build
          clang-18
          llvm-18
          llvm-18-dev
          libclang-18-dev
          python3
          cmake

      - name: Configure
        run: >-
          cmake -S . -B build-proxy -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCVITE_BUILD_COMPILER=ON
          -DCVITE_BUILD_LLVM_PASS=ON
          -DCVITE_BUILD_ORC_LOADER=ON
          -DCVITE_LIBCLANG_ROOT=/usr/lib/llvm-18
          -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          -DCVITE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build-proxy --verbose

      - name: Test complete suite
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build-proxy --output-on-failure \
            | tee /tmp/cvite-proxy-tests.txt

      - name: Prove cvite embeds the proxy
        shell: bash
        run: |
          set -euo pipefail
          strings build-proxy/cvite | grep -q '/cvite-clang'
          build-proxy/cvite-clang -std=c11 -O0 -g \
            -S -emit-llvm tests/fixtures/managed_allocation_input.c \
            -o /tmp/proxy.ll
          grep -q '!cvite.managed.alloc' /tmp/proxy.ll
          opt-18 -load-pass-plugin=build-proxy/CViteLoweringPass.so \
            -passes=cvite-lowering,verify \
            -S /tmp/proxy.ll -o /tmp/proxy-lowered.ll
          grep -q '__cvite_host_managed_allocate' /tmp/proxy-lowered.ll
          grep -q '__cvite_host_managed_track_pointer' /tmp/proxy-lowered.ll

      - name: Remove all one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- \
            .cvite \
            .github/next \
            .github/managed-next \
            .github/allocation-next \
            .github/instrumentation-next \
            .github/driver-next
          find .github/workflows -maxdepth 1 -type f ! -name ci.yml -delete
          git diff --check

      - name: Commit verified source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            CMakeLists.txt \
            CMakePresets.json \
            README.md \
            cmake \
            docs \
            examples \
            include \
            scripts \
            src \
            tests
          git add -u -- .github .cvite || true
          git diff --cached --check
          git commit -m "feat: make typed allocation instrumentation transparent to cvite run"
          git push origin HEAD:bootstrap/m0-runtime
