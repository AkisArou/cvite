name: Isolate automatic native link header

on:
  push:
    branches:
      - bootstrap/m0-runtime
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cvite-automatic-link-discovery
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Remove the C-only run-state header from the C++ implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = '''#include "run_internal.h"

          #include "cvite/orc_loader.h"'''
          new = '''#include "cvite/orc_loader.h"'''
          changed = False
          for path in [Path('.cvite/apply-auto-link.py'), Path('src/cli/native_link.cpp')]:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed = True
          Path('.github/workflows/fix-auto-link-header.yml').unlink()
          print('changed=', changed)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .cvite/apply-auto-link.py src/cli/native_link.cpp 2>/dev/null || true
          git rm --cached --ignore-unmatch .github/workflows/fix-auto-link-header.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: isolate automatic link C++ implementation"
          git push origin HEAD:bootstrap/m0-runtime
