name: Promote end-to-end managed live migration

on:
  push:
    branches:
      - bootstrap/m0-runtime

permissions:
  contents: write

concurrency:
  group: cvite-managed-pipeline-final
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.actor == 'github-actions[bot]' &&
      startsWith(github.event.head_commit.message,
                 'feat: add transparent Clang compiler proxy')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Promote live-migration compiler/runtime integration
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find .github/live-migration-next -maxdepth 1 -type f -name 'apply-*.py' | sort)
          test "${#scripts[@]}" -ge 1
          for script in "${scripts[@]}"; do
            python3 "$script"
          done
          if test -f .github/driver-next/apply-managed-live-test.py; then
            python3 .github/driver-next/apply-managed-live-test.py
          fi
          test -f src/transform/managed_baseline_registration_pass.h
          git diff --check

      - name: Validate promoted source scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          fixed = {'CMakeLists.txt', 'CMakePresets.json', 'README.md'}
          roots = {'cmake', 'docs', 'examples', 'include', 'scripts', 'src', 'tests'}
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '--diff-filter=ACMRT'], text=True
          ).splitlines()
          selected = []
          for item in changed:
              path = Path(item)
              if item in fixed or (path.parts and path.parts[0] in roots):
                  selected.append(item)
              elif not item.startswith('.github/'):
                  raise SystemExit(f'unexpected live-migration path: {item}')
          if not selected:
              raise SystemExit('live-migration applicators produced no source changes')
          Path('/tmp/cvite-live-migration-paths').write_text(
              '\n'.join(selected) + '\n', encoding='utf-8'
          )
          print('\n'.join(selected))
          PY

      - name: Install pinned LLVM toolchain
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          ninja-build cmake clang-18 llvm-18 llvm-18-dev libclang-18-dev python3

      - name: Build and run the complete live-refresh suite
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-managed-live -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCVITE_BUILD_COMPILER=ON \
            -DCVITE_BUILD_LLVM_PASS=ON \
            -DCVITE_BUILD_ORC_LOADER=ON \
            -DCVITE_BUILD_SOAK_TESTS=ON \
            -DCVITE_LIBCLANG_ROOT=/usr/lib/llvm-18 \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DCVITE_WARNINGS_AS_ERRORS=ON
          cmake --build build-managed-live --verbose
          ctest --test-dir build-managed-live --output-on-failure

      - name: Publish verified live migration
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- .github/live-migration-next .github/driver-next
          rm -f -- \
            .github/workflows/consolidate-managed-live.yml \
            .github/workflows/promote-managed-live-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS= read -r path; do
            test -n "$path" && git add -- "$path"
          done < /tmp/cvite-live-migration-paths
          git add -u -- \
            .github/live-migration-next \
            .github/driver-next \
            .github/workflows/consolidate-managed-live.yml \
            .github/workflows/promote-managed-live-migration.yml
          git diff --cached --check
          git commit -m "feat: preserve append-only managed state live [skip-managed-consolidation]"
          git fetch origin bootstrap/m0-runtime
          git rebase origin/bootstrap/m0-runtime
          git push origin HEAD:bootstrap/m0-runtime
