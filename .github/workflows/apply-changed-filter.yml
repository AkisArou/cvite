name: Apply changed-implementation filter

on:
  push:
    branches:
      - bootstrap/m0-runtime
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Install LLVM 18 development toolchain
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          ninja-build
          clang-18
          llvm-18
          llvm-18-dev
          libclang-18-dev
          python3

      - name: Apply implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 .cvite/apply-changed-filter.py
          rm -- .cvite/apply-changed-filter.py
          rm -- .github/workflows/apply-changed-filter.yml
          rm -f -- .github/workflows/apply-multitu.yml .cvite/multitu-patch.tar.gz
          git diff --check

      - name: Configure
        run: >-
          cmake -S . -B build-filter -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCVITE_BUILD_COMPILER=ON
          -DCVITE_BUILD_LLVM_PASS=ON
          -DCVITE_BUILD_ORC_LOADER=ON
          -DCVITE_LIBCLANG_ROOT=/usr/lib/llvm-18
          -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          -DCVITE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build-filter --verbose

      - name: Test
        run: ctest --test-dir build-filter --output-on-failure

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            CMakeLists.txt \
            docs/candidate-objects.md \
            include/cvite/candidate.h \
            include/cvite/orc_loader.h \
            src/cli/watcher.c \
            src/host/orc_loader.cpp \
            src/transform/candidate_pass.cpp \
            src/transform/transform_support.h \
            tests/fixtures/filter_baseline.c \
            tests/fixtures/filter_candidate_one.c \
            tests/fixtures/filter_candidate_two.c \
            tests/test_candidate_filter.c \
            .github/workflows/ci.yml
          git rm --cached --ignore-unmatch .cvite/apply-changed-filter.py
          git rm --cached --ignore-unmatch .github/workflows/apply-changed-filter.yml
          git rm --cached --ignore-unmatch .github/workflows/apply-multitu.yml
          git rm --cached --ignore-unmatch .cvite/multitu-patch.tar.gz
          git diff --cached --check
          git commit -m "feat: publish only changed candidate implementations"
          git push origin HEAD:bootstrap/m0-runtime
