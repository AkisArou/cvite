name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-scoped-patch:
    name: Apply scoped implementation patch
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'bootstrap/m0-runtime'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply patch when staged
        shell: bash
        run: |
          set -euo pipefail
          archive=.cvite/compile-db-patch.tar.gz.b64
          if [[ ! -f "$archive" ]]; then
            echo "No staged patch."
            exit 0
          fi

          base64 --decode "$archive" > /tmp/cvite-compile-db-patch.tar.gz
          echo "a9d1432a8064c56e4f4200d2da092c6e3e8fc2a72b94a1216ea2e582ab34fe4e  /tmp/cvite-compile-db-patch.tar.gz" | sha256sum --check
          tar -xzf /tmp/cvite-compile-db-patch.tar.gz -C .
          rm -- "$archive"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            CMakeLists.txt \
            docs/dev-server.md \
            src/cli/compile_database.c \
            src/cli/run.c \
            src/cli/run_internal.h \
            src/cli/toolchain.c \
            src/cli/watcher.c \
            src/cli/watch_dependencies.inc \
            tests/check_run.py \
            tests/fixtures/run_app.c \
            .cvite/compile-db-patch.tar.gz.b64
          git diff --cached --check
          git commit -m "feat: ingest compile_commands for live builds"
          git push origin HEAD:bootstrap/m0-runtime

  build:
    name: ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        env:
          CC: ${{ matrix.compiler }}
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCVITE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --verbose

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja and Clang
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      - name: Configure
        env:
          CC: clang
          CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
        run: >-
          cmake -S . -B build-sanitize -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCVITE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build-sanitize --verbose

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitize --output-on-failure

  compiler-pipeline:
    name: Clang/LLVM compiler pipeline
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang 18 development libraries
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          ninja-build
          clang-18
          llvm-18
          llvm-18-dev
          libclang-18-dev
          python3

      - name: Configure
        run: >-
          cmake -S . -B build-compiler -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCVITE_BUILD_COMPILER=ON
          -DCVITE_BUILD_LLVM_PASS=ON
          -DCVITE_BUILD_ORC_LOADER=ON
          -DCVITE_LIBCLANG_ROOT=/usr/lib/llvm-18
          -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          -DCVITE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build-compiler --verbose

      - name: Test
        run: ctest --test-dir build-compiler --output-on-failure
