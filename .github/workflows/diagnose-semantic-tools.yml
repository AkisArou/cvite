name: Diagnose semantic tooling

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cvite-semantic-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'bootstrap/m0-runtime'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Apply transactional semantic integration
        shell: bash
        run: |
          set -euo pipefail
          python3 .cvite/apply-semantic-cache-transaction.py
          python3 .cvite/apply-layout-restart.py
          git diff --check

      - name: Install LLVM 18 toolchain
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          ninja-build
          clang-18
          llvm-18
          llvm-18-dev
          libclang-18-dev
          python3
          cmake

      - name: Configure, build, and test with transcript
        shell: bash
        run: |
          set +e
          set -o pipefail
          {
            echo '=== CONFIGURE ==='
            cmake -S . -B build-llvm -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_C_COMPILER=clang-18 \
              -DCMAKE_CXX_COMPILER=clang++-18 \
              -DCVITE_BUILD_COMPILER=ON \
              -DCVITE_BUILD_LLVM_PASS=ON \
              -DCVITE_BUILD_ORC_LOADER=ON \
              -DCVITE_LIBCLANG_ROOT=/usr/lib/llvm-18 \
              -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
              -DCVITE_WARNINGS_AS_ERRORS=ON
            configure_status=$?
            echo "configure_status=${configure_status}"
            if [ "${configure_status}" -eq 0 ]; then
              echo '=== BUILD ==='
              cmake --build build-llvm --verbose
              build_status=$?
            else
              build_status=125
            fi
            echo "build_status=${build_status}"
            if [ "${configure_status}" -eq 0 ] && [ "${build_status}" -eq 0 ]; then
              echo '=== TEST ==='
              ctest --test-dir build-llvm --output-on-failure
              test_status=$?
            else
              test_status=125
            fi
            echo "test_status=${test_status}"
            if [ "${configure_status}" -ne 0 ]; then
              exit "${configure_status}"
            fi
            if [ "${build_status}" -ne 0 ]; then
              exit "${build_status}"
            fi
            exit "${test_status}"
          } 2>&1 | tee /tmp/cvite-semantic-transcript.txt
          exit ${PIPESTATUS[0]}

      - name: Upload diagnostic transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cvite-semantic-diagnostics-${{ github.sha }}
          path: /tmp/cvite-semantic-transcript.txt
          retention-days: 2
          if-no-files-found: error
