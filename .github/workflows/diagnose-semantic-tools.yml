name: Diagnose semantic tooling

on:
  push:
    branches:
      - bootstrap/m0-runtime
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cvite-semantic-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Activate semantic targets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cmake = Path('CMakeLists.txt')
          text = cmake.read_text(encoding='utf-8')
          marker = '''if(CVITE_BUILD_EXAMPLES)\n    add_executable(cvite_runtime_transaction examples/runtime_transaction.c)\n'''
          insertion = '''# Clang-backed semantic analysis, conservative managed-layout planning,\n# and opt-in development stress tests are declared after the core/compiler\n# targets they extend.\ninclude(cmake/CViteSemantic.cmake)\ninclude(cmake/CViteExperimental.cmake)\n\n'''
          if insertion not in text:
              if marker not in text:
                  raise SystemExit('root CMake insertion marker is missing')
              cmake.write_text(text.replace(marker, insertion + marker, 1), encoding='utf-8')

          experimental = Path('cmake/CViteExperimental.cmake')
          text = experimental.read_text(encoding='utf-8')
          old = '''        target_link_libraries(\n            cvite_test_runtime_stress\n            PRIVATE cvite::runtime Threads::Threads\n        )\n        cvite_set_warnings(cvite_test_runtime_stress)\n'''
          new = '''        target_link_libraries(\n            cvite_test_runtime_stress\n            PRIVATE cvite::runtime Threads::Threads\n        )\n        target_compile_definitions(\n            cvite_test_runtime_stress\n            PRIVATE _POSIX_C_SOURCE=200809L\n        )\n        cvite_set_warnings(cvite_test_runtime_stress)\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('runtime-stress target marker is missing')
              experimental.write_text(text.replace(old, new, 1), encoding='utf-8')

          stress = Path('tests/test_runtime_stress.c')
          text = stress.read_text(encoding='utf-8')
          text = text.replace('CVITE_ID(UINT64_C(0xA100),', 'CVITE_ID_INITIALIZER(UINT64_C(0xA100),')
          text = text.replace('CVITE_ID(UINT64_C(0xB200),', 'CVITE_ID_INITIALIZER(UINT64_C(0xB200),')
          stress.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Install LLVM 18 toolchain
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          ninja-build
          clang-18
          llvm-18
          llvm-18-dev
          libclang-18-dev
          python3
          cmake

      - name: Configure, build, and test with transcript
        id: verify
        shell: bash
        run: |
          set +e
          set -o pipefail
          {
            echo '=== CONFIGURE ==='
            cmake -S . -B build-llvm -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_C_COMPILER=clang-18 \
              -DCMAKE_CXX_COMPILER=clang++-18 \
              -DCVITE_BUILD_COMPILER=ON \
              -DCVITE_BUILD_LLVM_PASS=ON \
              -DCVITE_BUILD_ORC_LOADER=ON \
              -DCVITE_LIBCLANG_ROOT=/usr/lib/llvm-18 \
              -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
              -DCVITE_WARNINGS_AS_ERRORS=ON
            configure_status=$?
            echo "configure_status=${configure_status}"
            if [ "${configure_status}" -eq 0 ]; then
              echo '=== BUILD ==='
              cmake --build build-llvm --verbose
              build_status=$?
            else
              build_status=125
            fi
            echo "build_status=${build_status}"
            if [ "${configure_status}" -eq 0 ] && [ "${build_status}" -eq 0 ]; then
              echo '=== TEST ==='
              ctest --test-dir build-llvm --output-on-failure
              test_status=$?
            else
              test_status=125
            fi
            echo "test_status=${test_status}"
            if [ "${configure_status}" -ne 0 ]; then
              exit "${configure_status}"
            fi
            if [ "${build_status}" -ne 0 ]; then
              exit "${build_status}"
            fi
            exit "${test_status}"
          } 2>&1 | tee /tmp/cvite-semantic-transcript.txt
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit "${status}"

      - name: Upload diagnostic transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cvite-semantic-diagnostics-${{ github.sha }}
          path: /tmp/cvite-semantic-transcript.txt
          retention-days: 2
          if-no-files-found: error
