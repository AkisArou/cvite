name: Verify managed instrumentation source

on:
  push:
    branches:
      - bootstrap/m0-runtime
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cvite-consolidate-lifecycle
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Require consolidated compiler/runtime source
        shell: bash
        run: |
          set -euo pipefail
          test -f src/compiler/allocation_annotator.cpp
          test -f src/transform/managed_allocation_pass.cpp
          test -f src/host/managed_host.c
          test -f src/runtime/managed_memory.c
          test -f tests/check_managed_allocation_pass.py
          test ! -d .cvite
          test ! -d .github/next
          test ! -d .github/managed-next
          test ! -d .github/allocation-next
          test ! -d .github/instrumentation-next

      - name: Install Clang and LLVM 18
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          ninja-build
          clang-18
          llvm-18
          llvm-18-dev
          libclang-18-dev
          python3
          cmake

      - name: Configure
        run: >-
          cmake -S . -B build-instrumentation-verified -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCVITE_BUILD_COMPILER=ON
          -DCVITE_BUILD_LLVM_PASS=ON
          -DCVITE_BUILD_ORC_LOADER=ON
          -DCVITE_LIBCLANG_ROOT=/usr/lib/llvm-18
          -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          -DCVITE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build-instrumentation-verified --verbose

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build-instrumentation-verified --output-on-failure \
            | tee /tmp/cvite-instrumentation-verification.txt

      - name: Capture transformed IR evidence
        shell: bash
        run: |
          set -euo pipefail
          allocation=build-instrumentation-verified/cvite-allocation-index
          annotator=build-instrumentation-verified/cvite-allocation-annotate
          plugin=build-instrumentation-verified/CViteLoweringPass.so
          "$allocation" index \
            --source tests/fixtures/managed_allocation_input.c \
            --output /tmp/managed.cvaidx \
            -- -std=c11
          clang-18 -std=c11 -O0 -g -fno-discard-value-names \
            -S -emit-llvm tests/fixtures/managed_allocation_input.c \
            -o /tmp/managed.raw.ll
          "$annotator" --input /tmp/managed.raw.ll \
            --index /tmp/managed.cvaidx \
            --output /tmp/managed.annotated.ll \
            | tee /tmp/annotator.txt
          opt-18 -load-pass-plugin="$plugin" \
            -passes=cvite-managed-allocation,verify \
            -S /tmp/managed.annotated.ll \
            -o /tmp/managed.transformed.ll
          grep -E '__cvite_host_managed_(allocate|callocate|free|track_pointer|escape_pointer)' \
            /tmp/managed.transformed.ll \
            | sort -u > /tmp/managed-symbols.txt

      - name: Record verified boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          {
            echo '# Managed allocation instrumentation verification'
            echo
            echo "- Tested commit: \`$(git rev-parse HEAD)\`"
            echo '- Toolchain: Clang/LLVM 18, Debug, warnings as errors'
            echo '- Complete CTest suite: **passed**'
            echo '- Clang typed-allocation sidecar: **verified**'
            echo '- LLVM debug-location annotation: **verified**'
            echo '- Annotated `malloc`/`calloc` rewrite: **verified**'
            echo '- Hidden managed `free`: **verified**'
            echo '- Persistent global pointer-slot tracking: **verified**'
            echo '- Conservative external-call/return/ptr-to-int escapes: **verified**'
            echo
            echo '> The pass is development-only and conservative. Unknown or escaped pointers are not migrated; they force restart or remain unmanaged.'
            echo
            echo '## Annotator result'
            echo
            echo '```text'
            cat /tmp/annotator.txt
            echo '```'
            echo
            echo '## Generated runtime symbols'
            echo
            echo '```text'
            cat /tmp/managed-symbols.txt
            echo '```'
            echo
            echo '## Full test transcript'
            echo
            echo '```text'
            cat /tmp/cvite-instrumentation-verification.txt
            echo '```'
          } > docs/instrumentation-verification.md
          rm -f -- .github/workflows/verify-managed-instrumentation.yml
          git diff --check

      - name: Commit verification record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/instrumentation-verification.md
          git add -u -- .github/workflows/verify-managed-instrumentation.yml
          git diff --cached --check
          git commit -m "docs: record managed instrumentation verification"
          git push origin HEAD:bootstrap/m0-runtime
