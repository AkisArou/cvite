name: Harden automatic native link fixture

on:
  push:
    branches:
      - bootstrap/m0-runtime
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cvite-automatic-link-discovery
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Use the canonical transformed main signature
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = '''int main(void)
          {
              const struct timespec pause = {0, 20000000L};'''
          new = '''int main(int argc, char **argv)
          {
              const struct timespec pause = {0, 20000000L};
              (void)argc;
              (void)argv;'''

          changed = False
          for path in [Path('.cvite/apply-auto-link.py'), Path('tests/fixtures/auto_link_app.c')]:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed = True

          Path('.github/workflows/fix-auto-link-fixture.yml').unlink()
          print('changed=', changed)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .cvite/apply-auto-link.py tests/fixtures/auto_link_app.c 2>/dev/null || true
          git rm --cached --ignore-unmatch .github/workflows/fix-auto-link-fixture.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: use canonical main in automatic link fixture"
          git push origin HEAD:bootstrap/m0-runtime
