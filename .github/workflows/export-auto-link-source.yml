name: Export source for automatic link discovery

on:
  push:
    branches:
      - bootstrap/m0-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package repository source
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=.github/workflows/export-auto-link-source.yml -czf /tmp/cvite-source.tar.gz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: cvite-auto-link-source-${{ github.sha }}
          path: /tmp/cvite-source.tar.gz
          retention-days: 1
          if-no-files-found: error
