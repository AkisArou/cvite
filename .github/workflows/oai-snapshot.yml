name: OAI exact source snapshot

on:
  push:
    branches:
      - bootstrap/m0-runtime

permissions:
  contents: write

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0
      - name: Package exact source
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=.github/workflows/oai-snapshot.yml \
            --exclude=.github/oai-snapshot-run-id \
            -czf /tmp/cvite-exact.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: cvite-exact-${{ github.sha }}
          path: /tmp/cvite-exact.tar.gz
          retention-days: 1
          if-no-files-found: error
      - name: Publish run id
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > .github/oai-snapshot-run-id
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/oai-snapshot-run-id
          git commit -m "ci: publish temporary snapshot run id"
          git push origin HEAD:bootstrap/m0-runtime
