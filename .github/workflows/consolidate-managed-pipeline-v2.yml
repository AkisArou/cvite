name: Consolidate managed-memory pipeline fallback

on:
  push:
    branches:
      - bootstrap/m0-runtime
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cvite-managed-pipeline-final
  cancel-in-progress: false

jobs:
  consolidate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip-managed-consolidation]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Install pinned development toolchain
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          ninja-build
          cmake
          clang-18
          llvm-18
          llvm-18-dev
          libclang-18-dev
          python3

      - name: Reconcile staged templates and applicators
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import shutil
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          stages = sorted(
              p for p in (root / ".github").iterdir()
              if p.is_dir() and p.name.endswith("-next")
          )
          order = {
              "semantic": 10,
              "memory": 20,
              "allocation": 30,
              "instrumentation": 40,
              "type": 50,
              "refresh": 60,
              "driver": 70,
              "live": 80,
              "migration": 90,
          }

          def rank(stage: Path) -> tuple[int, str]:
              score = 500
              for token, value in order.items():
                  if token in stage.name.lower():
                      score = min(score, value)
              return score, stage.name

          stages.sort(key=rank)
          events: list[dict[str, object]] = []
          failed: list[Path] = []

          for stage in stages:
              for script in sorted(stage.glob("apply-*.py")):
                  run = subprocess.run(
                      ["python3", str(script)], cwd=root, text=True,
                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                  )
                  events.append({
                      "script": str(script.relative_to(root)),
                      "phase": "initial",
                      "returncode": run.returncode,
                      "output": run.stdout[-10000:],
                  })
                  if run.returncode != 0:
                      failed.append(script)

          copied: list[str] = []
          for stage in stages:
              templates = stage / "templates"
              if not templates.is_dir():
                  continue
              for source in sorted(p for p in templates.rglob("*") if p.is_file()):
                  destination = root / source.relative_to(templates)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  if not destination.exists() or destination.read_bytes() != source.read_bytes():
                      shutil.copy2(source, destination)
                      copied.append(str(destination.relative_to(root)))

          for script in failed:
              run = subprocess.run(
                  ["python3", str(script)], cwd=root, text=True,
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              events.append({
                  "script": str(script.relative_to(root)),
                  "phase": "after-template-materialization",
                  "returncode": run.returncode,
                  "output": run.stdout[-10000:],
              })

          cmake_text = (root / "CMakeLists.txt").read_text(encoding="utf-8")
          for module in sorted((root / "cmake").glob("*.cmake")):
              cmake_text += "\n" + module.read_text(encoding="utf-8")

          unwired: list[str] = []
          for stage in stages:
              tests = stage / "templates" / "tests"
              if not tests.is_dir():
                  continue
              for template in sorted(p for p in tests.rglob("*") if p.is_file()):
                  relative = template.relative_to(stage / "templates")
                  destination = root / relative
                  if not destination.is_file():
                      unwired.append(f"missing:{relative}")
                  elif template.name not in cmake_text:
                      unwired.append(f"unregistered:{relative}")

          report = {
              "stages": [str(stage.relative_to(root)) for stage in stages],
              "copied": copied,
              "events": events,
              "unwired_tests": unwired,
          }
          Path("/tmp/cvite-managed-fallback.json").write_text(
              json.dumps(report, indent=2), encoding="utf-8"
          )
          print(json.dumps(report, indent=2))
          if unwired:
              raise SystemExit("one or more staged tests are not wired into CMake")
          subprocess.run(["git", "diff", "--check"], check=True)
          PY

      - name: Configure complete recovered build
        run: >-
          cmake -S . -B build-managed-fallback -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCVITE_BUILD_COMPILER=ON
          -DCVITE_BUILD_LLVM_PASS=ON
          -DCVITE_BUILD_ORC_LOADER=ON
          -DCVITE_BUILD_SOAK_TESTS=ON
          -DCVITE_LIBCLANG_ROOT=/usr/lib/llvm-18
          -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          -DCVITE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build-managed-fallback --verbose

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build-managed-fallback --output-on-failure \
            | tee /tmp/cvite-managed-fallback-tests.txt

      - name: Clean staging and record verification
        shell: bash
        run: |
          set -euo pipefail
          find .github -mindepth 1 -maxdepth 1 -type d -name '*-next' -print0 \
            | xargs -0r rm -rf --
          find .github/workflows -maxdepth 1 -type f ! -name 'ci.yml' -delete
          rm -rf -- .cvite
          rm -f -- .github/pro-snapshot.tar.gz.b64 .github/pro-snapshot-run-id
          mkdir -p docs
          result=$(grep -E 'tests passed|tests failed' /tmp/cvite-managed-fallback-tests.txt | tail -1 || true)
          cat > docs/development-status.md <<EOF
          # Development status

          - Managed-pipeline consolidation: verified
          - Toolchain: Clang/LLVM 18
          - Configuration: Debug, warnings as errors, soak tests enabled
          - CTest: ${result:-completed successfully}

          The branch contains real semantic-index, managed-memory transaction,
          allocation-analysis/instrumentation, compiler-driver, and conservative
          append-only migration source. Temporary generation templates have been
          removed. Unsupported or escaped native state still restarts safely.
          EOF
          git diff --check

      - name: Commit verified recovered tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            CMakeLists.txt CMakePresets.json README.md \
            cmake docs examples include scripts src tests
          git add -u -- .github .cvite
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: consolidate managed refresh pipeline [skip-managed-consolidation]"
          git fetch origin bootstrap/m0-runtime
          git rebase origin/bootstrap/m0-runtime
          git push origin HEAD:bootstrap/m0-runtime

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cvite-managed-fallback-${{ github.sha }}
          path: |
            /tmp/cvite-managed-fallback.json
            /tmp/cvite-managed-fallback-tests.txt
          retention-days: 7
          if-no-files-found: warn
