name: Verify consolidated CVite source

on:
  push:
    branches:
      - bootstrap/m0-runtime
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cvite-consolidate-lifecycle
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Require consolidated semantic source
        shell: bash
        run: |
          set -euo pipefail
          test -f include/cvite/semantic_index.hpp
          test -f src/compiler/semantic_index.cpp
          test -f src/compiler/layout_plan.cpp
          test -f tests/test_layout_plan.cpp
          test -f tests/test_runtime_stress.c
          grep -q 'include(cmake/CViteSemantic.cmake)' CMakeLists.txt
          grep -q 'managed migration candidate' src/compiler/layout_plan.cpp

      - name: Install pinned toolchain
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          ninja-build
          clang-18
          llvm-18
          llvm-18-dev
          libclang-18-dev
          python3
          cmake

      - name: Configure
        run: >-
          cmake -S . -B build-verified -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCVITE_BUILD_COMPILER=ON
          -DCVITE_BUILD_LLVM_PASS=ON
          -DCVITE_BUILD_ORC_LOADER=ON
          -DCVITE_LIBCLANG_ROOT=/usr/lib/llvm-18
          -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          -DCVITE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build-verified --verbose

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build-verified --output-on-failure \
            | tee /tmp/cvite-verified-tests.txt

      - name: Record exact verified state
        shell: bash
        run: |
          set -euo pipefail
          lifecycle_filter=no
          lifecycle_quiescence=no
          tls_boundary=no
          grep -q 'implementation_high' include/cvite/candidate.h && lifecycle_filter=yes || true
          grep -q 'cvite_host_try_begin_collection' include/cvite/host.h && lifecycle_quiescence=yes || true
          grep -q 'CVITE_CANDIDATE_FLAG_RESTART_TLS' include/cvite/candidate.h && tls_boundary=yes || true

          mkdir -p docs
          {
            echo '# Verified development state'
            echo
            echo "- Commit tested: \`$(git rev-parse HEAD)\`"
            echo '- Toolchain: Clang/LLVM 18, Debug, warnings as errors'
            echo '- Complete CTest result: **passed**'
            echo "- Implementation fingerprints present: **${lifecycle_filter}**"
            echo "- Quiescent collection gate present: **${lifecycle_quiescence}**"
            echo "- TLS restart boundary present: **${tls_boundary}**"
            echo '- Clang semantic record index: **yes**'
            echo '- Field-level layout diff: **yes**'
            echo '- Managed append-only planner: **yes, experimental and not arbitrary-pointer migration**'
            echo '- Concurrent publication/signal stress test: **yes**'
            echo
            echo '## CTest transcript'
            echo
            echo '```text'
            cat /tmp/cvite-verified-tests.txt
            echo '```'
          } > docs/verification-latest.md

          rm -f -- .github/workflows/verify-current-state.yml
          git diff --check

      - name: Commit verification record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/verification-latest.md
          git add -u -- .github/workflows/verify-current-state.yml
          git diff --cached --check
          git commit -m "docs: record verified CVite development state"
          git push origin HEAD:bootstrap/m0-runtime
