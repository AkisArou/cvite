name: Finalize managed-memory commit barrier

on:
  push:
    branches:
      - bootstrap/m0-runtime

permissions:
  contents: write

concurrency:
  group: cvite-managed-pipeline-final
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      contains(github.event.head_commit.message, '[finalize-managed-core]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Materialize and harden the managed-memory core
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('src/runtime/managed_memory.c')
          test_path = Path('tests/test_managed_memory.c')
          header_path = Path('include/cvite/managed_memory.h')
          doc_path = Path('docs/managed-memory.md')

          if not all(path.is_file() for path in (source_path, test_path, header_path, doc_path)):
              payload_path = Path('.github/workflows/apply-managed-memory-core.yml')
              if not payload_path.is_file():
                  raise SystemExit('managed-memory source and recovery payload are both absent')
              payload_text = payload_path.read_text(encoding='utf-8')

              def recover(path: Path, marker: str) -> None:
                  opener = f"          cat > {path.as_posix()} <<'{marker}'\n"
                  closer = f"\n          {marker}\n"
                  if opener not in payload_text:
                      raise SystemExit(f'missing payload for {path}')
                  body = payload_text.split(opener, 1)[1].split(closer, 1)[0]
                  lines = [
                      line[10:] if line.startswith('          ') else line
                      for line in body.splitlines()
                  ]
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

              recover(header_path, 'CVITE_HEADER')
              recover(source_path, 'CVITE_SOURCE')
              recover(test_path, 'CVITE_TEST')
              recover(doc_path, 'CVITE_DOC')

          test = test_path.read_text(encoding='utf-8').replace(
              'CHECK(cvite_managed_memory_pointer_count(memory) == 2U);',
              'CHECK(cvite_managed_memory_pointer_count(memory) == 3U);',
              1,
          )
          test_path.write_text(test, encoding='utf-8')

          source = source_path.read_text(encoding='utf-8')

          block_old = '''typedef struct cvite_managed_block {
              void *base;
              unsigned char *address;
          } cvite_managed_block;
          '''
          block_new = '''typedef struct cvite_managed_block {
              void *base;
              unsigned char *address;
              size_t allocation_index;
          } cvite_managed_block;

          typedef struct cvite_managed_pointer_patch {
              cvite_managed_pointer_kind kind;
              void **external_slot;
              unsigned char *owned_location;
              void *value;
          } cvite_managed_pointer_patch;
          '''
          if block_old in source:
              source = source.replace(block_old, block_new, 1)
          elif 'typedef struct cvite_managed_pointer_patch' not in source:
              raise SystemExit('managed block marker is missing')

          owned_start = (
              'cvite_managed_status cvite_managed_memory_track_owned_pointer(\n'
          )
          owned_end = (
              '\ncvite_managed_status cvite_managed_memory_untrack_owned_pointer(\n'
          )
          if owned_start not in source or owned_end not in source:
              raise SystemExit('owned-pointer function markers are missing')
          owned_begin = source.index(owned_start)
          owned_finish = source.index(owned_end, owned_begin)
          owned_replacement = r'''cvite_managed_status cvite_managed_memory_track_owned_pointer(
              cvite_managed_memory *memory,
              cvite_id owner_id,
              size_t slot_offset,
              cvite_id target_id,
              size_t target_offset,
              cvite_managed_error *error)
          {
              cvite_managed_status status;
              void *value;
              size_t index;

              if (memory == NULL || cvite_managed_zero_id(owner_id)) {
                  return cvite_managed_fail(
                      error,
                      CVITE_MANAGED_STATUS_INVALID_ARGUMENT,
                      owner_id,
                      "owned managed pointer arguments are invalid");
              }
              status = cvite_managed_require_idle(memory, error);
              if (status != CVITE_MANAGED_STATUS_OK) {
                  return status;
              }
              status = cvite_managed_current_target(
                  memory,
                  target_id,
                  target_offset,
                  &value,
                  error);
              if (status != CVITE_MANAGED_STATUS_OK) {
                  return status;
              }

              for (index = 0U; index < memory->pointer_count; ++index) {
                  cvite_managed_pointer *pointer = &memory->pointers[index];
                  if (pointer->kind == CVITE_MANAGED_POINTER_OWNED &&
                      cvite_managed_same_id(pointer->owner_id, owner_id) &&
                      pointer->slot_offset == slot_offset) {
                      status = cvite_managed_write_owned_slot(
                          memory,
                          owner_id,
                          slot_offset,
                          value,
                          error);
                      if (status != CVITE_MANAGED_STATUS_OK) {
                          return status;
                      }
                      pointer->target_id = target_id;
                      pointer->target_offset = target_offset;
                      ++memory->generation;
                      cvite_managed_error_clear(error);
                      return CVITE_MANAGED_STATUS_OK;
                  }
              }

              status = cvite_managed_reserve(
                  (void **)&memory->pointers,
                  &memory->pointer_capacity,
                  sizeof(memory->pointers[0]),
                  memory->pointer_count + 1U,
                  error);
              if (status != CVITE_MANAGED_STATUS_OK) {
                  return status;
              }
              status = cvite_managed_write_owned_slot(
                  memory,
                  owner_id,
                  slot_offset,
                  value,
                  error);
              if (status != CVITE_MANAGED_STATUS_OK) {
                  return status;
              }
              memory->pointers[memory->pointer_count++] =
                  (cvite_managed_pointer){
                      CVITE_MANAGED_POINTER_OWNED,
                      NULL,
                      owner_id,
                      slot_offset,
                      target_id,
                      target_offset,
                  };
              ++memory->generation;
              cvite_managed_error_clear(error);
              return CVITE_MANAGED_STATUS_OK;
          }
          '''
          source = source[:owned_begin] + owned_replacement + source[owned_finish:]

          commit_start = (
              'cvite_managed_status cvite_managed_transaction_commit(\n'
          )
          commit_end = '\nvoid cvite_managed_transaction_abort(\n'
          if commit_start not in source or commit_end not in source:
              raise SystemExit('managed commit function markers are missing')
          commit_begin = source.index(commit_start)
          commit_finish = source.index(commit_end, commit_begin)
          commit_replacement = r'''cvite_managed_status cvite_managed_transaction_commit(
              cvite_managed_transaction **transaction_pointer,
              cvite_managed_error *error)
          {
              cvite_managed_transaction *transaction;
              cvite_managed_memory *memory;
              cvite_managed_block *blocks;
              cvite_managed_pointer_patch *patches;
              cvite_managed_status status;
              size_t index;

              if (transaction_pointer == NULL ||
                  *transaction_pointer == NULL ||
                  (*transaction_pointer)->memory == NULL) {
                  return cvite_managed_fail(
                      error,
                      CVITE_MANAGED_STATUS_INVALID_ARGUMENT,
                      CVITE_ID_ZERO,
                      "managed transaction is null");
              }
              transaction = *transaction_pointer;
              memory = transaction->memory;
              if (!memory->transaction_active) {
                  return cvite_managed_fail(
                      error,
                      CVITE_MANAGED_STATUS_INVALID_ARGUMENT,
                      CVITE_ID_ZERO,
                      "managed transaction is no longer active");
              }

              blocks = calloc(transaction->entry_count, sizeof(*blocks));
              if (transaction->entry_count != 0U && blocks == NULL) {
                  return cvite_managed_fail(
                      error,
                      CVITE_MANAGED_STATUS_OUT_OF_MEMORY,
                      CVITE_ID_ZERO,
                      "unable to stage managed replacement blocks");
              }
              patches = calloc(memory->pointer_count, sizeof(*patches));
              if (memory->pointer_count != 0U && patches == NULL) {
                  free(blocks);
                  return cvite_managed_fail(
                      error,
                      CVITE_MANAGED_STATUS_OUT_OF_MEMORY,
                      CVITE_ID_ZERO,
                      "unable to stage managed pointer patches");
              }

              for (index = 0U; index < transaction->entry_count; ++index) {
                  size_t allocation_index;
                  const cvite_managed_transaction_entry *entry =
                      &transaction->entries[index];
                  const cvite_managed_allocation *allocation;

                  if (!cvite_managed_find_allocation_index(
                          memory,
                          entry->id,
                          &allocation_index)) {
                      cvite_managed_release_blocks(blocks, index);
                      free(patches);
                      return cvite_managed_fail(
                          error,
                          CVITE_MANAGED_STATUS_NOT_FOUND,
                          entry->id,
                          "staged managed allocation disappeared");
                  }
                  allocation = &memory->allocations[allocation_index];
                  if (entry->new_size < allocation->size ||
                      entry->new_alignment != allocation->alignment) {
                      cvite_managed_release_blocks(blocks, index);
                      free(patches);
                      return cvite_managed_fail(
                          error,
                          CVITE_MANAGED_STATUS_UNSAFE_LAYOUT,
                          entry->id,
                          "managed allocation changed after staging");
                  }
                  status = cvite_managed_allocate_block(
                      entry->new_size,
                      entry->new_alignment,
                      &blocks[index],
                      entry->id,
                      error);
                  if (status != CVITE_MANAGED_STATUS_OK) {
                      cvite_managed_release_blocks(blocks, index);
                      free(patches);
                      return status;
                  }
                  blocks[index].allocation_index = allocation_index;
                  memcpy(
                      blocks[index].address,
                      allocation->address,
                      allocation->size);
              }

              /*
               * Resolve the complete pointer graph before publication. This is
               * the transaction's validation barrier: no live pointer has been
               * changed yet, and every later operation is non-failing.
               */
              for (index = 0U; index < memory->pointer_count; ++index) {
                  const cvite_managed_pointer *pointer =
                      &memory->pointers[index];
                  cvite_managed_pointer_patch *patch = &patches[index];

                  patch->kind = pointer->kind;
                  status = cvite_managed_staged_target(
                      transaction,
                      blocks,
                      pointer->target_id,
                      pointer->target_offset,
                      &patch->value,
                      error);
                  if (status != CVITE_MANAGED_STATUS_OK) {
                      cvite_managed_release_blocks(
                          blocks,
                          transaction->entry_count);
                      free(patches);
                      return status;
                  }
                  if (pointer->kind == CVITE_MANAGED_POINTER_EXTERNAL) {
                      if (pointer->external_slot == NULL) {
                          cvite_managed_release_blocks(
                              blocks,
                              transaction->entry_count);
                          free(patches);
                          return cvite_managed_fail(
                              error,
                              CVITE_MANAGED_STATUS_INVALID_POINTER_SLOT,
                              pointer->target_id,
                              "external managed pointer slot became null");
                      }
                      patch->external_slot = pointer->external_slot;
                  } else {
                      status = cvite_managed_staged_owned_slot(
                          transaction,
                          blocks,
                          pointer->owner_id,
                          pointer->slot_offset,
                          &patch->owned_location,
                          error);
                      if (status != CVITE_MANAGED_STATUS_OK) {
                          cvite_managed_release_blocks(
                              blocks,
                              transaction->entry_count);
                          free(patches);
                          return status;
                      }
                  }
              }

              for (index = 0U; index < memory->pointer_count; ++index) {
                  const cvite_managed_pointer_patch *patch = &patches[index];
                  if (patch->kind == CVITE_MANAGED_POINTER_EXTERNAL) {
                      *patch->external_slot = patch->value;
                  } else {
                      memcpy(
                          patch->owned_location,
                          &patch->value,
                          sizeof(patch->value));
                  }
              }

              for (index = 0U; index < transaction->entry_count; ++index) {
                  cvite_managed_allocation *allocation =
                      &memory->allocations[blocks[index].allocation_index];
                  void *old_base = allocation->base;
                  const cvite_managed_transaction_entry *entry =
                      &transaction->entries[index];

                  allocation->base = blocks[index].base;
                  allocation->address = blocks[index].address;
                  allocation->size = entry->new_size;
                  allocation->alignment = entry->new_alignment;
                  allocation->type_id = entry->new_type_id;
                  blocks[index].base = NULL;
                  blocks[index].address = NULL;
                  free(old_base);
              }
              free(patches);
              free(blocks);

              if (transaction->entry_count != 0U) {
                  ++memory->generation;
              }
              memory->transaction_active = false;
              free(transaction->entries);
              free(transaction);
              *transaction_pointer = NULL;
              cvite_managed_error_clear(error);
              return CVITE_MANAGED_STATUS_OK;
          }
          '''
          source = source[:commit_begin] + commit_replacement + source[commit_finish:]
          source_path.write_text(source, encoding='utf-8')

          cmake_path = Path('CMakeLists.txt')
          cmake = cmake_path.read_text(encoding='utf-8')
          source_line = '    src/runtime/managed_memory.c\n'
          if source_line not in cmake:
              marker = '    src/runtime/runtime_storage.c\n'
              if marker not in cmake:
                  raise SystemExit('cvite_runtime source marker was not found')
              cmake = cmake.replace(marker, marker + source_line, 1)
          if '# CVITE_MANAGED_MEMORY_TEST_BEGIN' not in cmake:
              cmake += r'''

          # CVITE_MANAGED_MEMORY_TEST_BEGIN
          if(BUILD_TESTING)
              add_executable(cvite_test_managed_memory tests/test_managed_memory.c)
              target_compile_features(cvite_test_managed_memory PRIVATE c_std_11)
              target_link_libraries(cvite_test_managed_memory PRIVATE cvite_runtime)
              if(CMAKE_C_COMPILER_ID MATCHES "GNU|Clang")
                  target_compile_options(cvite_test_managed_memory PRIVATE
                      -Wall -Wextra -Wpedantic -Wconversion -Wshadow
                      -Wformat=2 -Wundef
                  )
                  if(CVITE_WARNINGS_AS_ERRORS)
                      target_compile_options(cvite_test_managed_memory PRIVATE -Werror)
                  endif()
              endif()
              add_test(NAME managed-memory COMMAND cvite_test_managed_memory)
          endif()
          # CVITE_MANAGED_MEMORY_TEST_END
          '''
          cmake_path.write_text(cmake, encoding='utf-8')
          PY
          git diff --check

      - name: Install pinned tools
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y ninja-build cmake clang-18 gcc

      - name: Configure, build, and test
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-managed-final -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCVITE_BUILD_COMPILER=OFF \
            -DCVITE_BUILD_LLVM_PASS=OFF \
            -DCVITE_BUILD_ORC_LOADER=OFF \
            -DCVITE_WARNINGS_AS_ERRORS=ON
          cmake --build build-managed-final --verbose
          ctest --test-dir build-managed-final --output-on-failure

      - name: Dynamic and static analysis gates
        shell: bash
        run: |
          set -euo pipefail
          clang-18 \
            -std=c11 -O1 -g \
            -fsanitize=address,undefined \
            -fno-omit-frame-pointer \
            -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Wformat=2 -Wundef -Werror \
            -Iinclude src/runtime/managed_memory.c tests/test_managed_memory.c \
            -o /tmp/cvite-managed-final
          ASAN_OPTIONS=detect_leaks=1 \
          UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            /tmp/cvite-managed-final
          gcc \
            -std=c11 -O0 -fanalyzer \
            -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Wformat=2 -Wundef -Werror \
            -Iinclude -c src/runtime/managed_memory.c \
            -o /tmp/cvite-managed-final-analyzer.o

      - name: Publish only the green tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- \
            .github/workflows/apply-managed-memory-core.yml \
            .github/workflows/recover-managed-memory-core.yml \
            .github/workflows/recover-managed-memory-core-v2.yml \
            .github/workflows/finalize-managed-memory-core.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            CMakeLists.txt \
            include/cvite/managed_memory.h \
            src/runtime/managed_memory.c \
            tests/test_managed_memory.c \
            docs/managed-memory.md
          git add -u -- \
            .github/workflows/apply-managed-memory-core.yml \
            .github/workflows/recover-managed-memory-core.yml \
            .github/workflows/recover-managed-memory-core-v2.yml \
            .github/workflows/finalize-managed-memory-core.yml
          git diff --cached --check
          git commit -m "feat: add failure-atomic managed migration core [skip-managed-consolidation]"
          git fetch origin bootstrap/m0-runtime
          git rebase origin/bootstrap/m0-runtime
          git push origin HEAD:bootstrap/m0-runtime
