name: Consolidate lifecycle implementation

on:
  push:
    branches:
      - bootstrap/m0-runtime
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cvite-consolidate-lifecycle
  cancel-in-progress: false

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Apply staged lifecycle work
        shell: bash
        run: |
          set -euo pipefail

          for script in \
            .cvite/apply-filter-reclaim.py \
            .cvite/apply-safety-boundaries.py \
            .cvite/apply-refresh-diagnostics.py
          do
            if [[ -f "$script" ]]; then
              echo "Applying $script"
              python3 "$script"
            fi
          done

          git diff --check

      - name: Install Clang and LLVM 18
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          ninja-build
          clang-18
          llvm-18
          llvm-18-dev
          libclang-18-dev
          python3
          cmake

      - name: Configure
        run: >-
          cmake -S . -B build-consolidated -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCVITE_BUILD_COMPILER=ON
          -DCVITE_BUILD_LLVM_PASS=ON
          -DCVITE_BUILD_ORC_LOADER=ON
          -DCVITE_LIBCLANG_ROOT=/usr/lib/llvm-18
          -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          -DCVITE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build-consolidated --verbose

      - name: Test
        run: ctest --test-dir build-consolidated --output-on-failure

      - name: Validate changed paths
        shell: bash
        run: |
          set -euo pipefail
          unexpected=0
          while IFS= read -r path; do
            case "$path" in
              CMakeLists.txt|CMakePresets.json|README.md|docs/*|include/*|src/*|tests/*|cmake/*|scripts/*|examples/*|.cvite/*|.github/workflows/*)
                ;;
              *)
                echo "Unexpected modified path: $path" >&2
                unexpected=1
                ;;
            esac
          done < <(git status --porcelain=v1 | sed -E 's/^.. //; s/.* -> //')
          [[ "$unexpected" -eq 0 ]]

      - name: Remove one-shot implementation machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- .cvite
          find .github/workflows -maxdepth 1 -type f ! -name ci.yml -delete
          git diff --check

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            CMakeLists.txt \
            README.md \
            docs \
            include \
            src \
            tests

          [[ ! -e CMakePresets.json ]] || git add -- CMakePresets.json
          [[ ! -d cmake ]] || git add -- cmake
          [[ ! -d scripts ]] || git add -- scripts
          [[ ! -d examples ]] || git add -- examples

          git add -u -- .cvite .github/workflows
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "No source changes required."
            exit 0
          fi

          git commit -m "feat: land lifecycle-safe filtered refresh"
          git push origin HEAD:bootstrap/m0-runtime
