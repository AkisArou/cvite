name: Pro source snapshot

on:
  push:
    branches:
      - bootstrap/m0-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Package exact branch source
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=.github/workflows/pro-snapshot.yml -czf /tmp/cvite-pro-current.tar.gz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: cvite-pro-current-${{ github.sha }}
          path: /tmp/cvite-pro-current.tar.gz
          retention-days: 1
          if-no-files-found: error
