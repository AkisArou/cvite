name: Pro source snapshot

on:
  push:
    branches:
      - bootstrap/m0-runtime
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Package exact branch source
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=.github/workflows/pro-snapshot.yml \
            --exclude=.github/pro-snapshot.tar.gz.b64 \
            --exclude=.github/pro-snapshot-run-id \
            -czf /tmp/cvite-pro-current.tar.gz .

      - name: Upload exact source artifact
        uses: actions/upload-artifact@v4
        with:
          name: cvite-pro-current-${{ github.sha }}
          path: /tmp/cvite-pro-current.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Publish workflow run id
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '${{ github.run_id }}' > .github/pro-snapshot-run-id
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/pro-snapshot-run-id
          git diff --cached --check
          git commit -m "ci: publish exact source artifact run id"
          git push origin HEAD:bootstrap/m0-runtime
