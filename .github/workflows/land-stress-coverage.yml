name: Land refresh stress coverage

on:
  push:
    branches:
      - bootstrap/m0-runtime
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cvite-stress-coverage
  cancel-in-progress: false

jobs:
  verify-and-land:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Wire stress tests into CMake
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/test_runtime_stress.c
          test -f tests/soak_live_refresh.py

          python3 - <<'PY'
          from pathlib import Path

          stress = Path('tests/test_runtime_stress.c')
          text = stress.read_text(encoding='utf-8')
          old = '''        cvite_dispatch_view view;
                  cvite_error error;
                  if (cvite_runtime_acquire_view(stress_runtime, &view, &error) !=
                      CVITE_STATUS_OK) {
                      atomic_fetch_add_explicit(
                          &stress_runtime_errors, 1U, memory_order_relaxed);
                      continue;
                  }
                  if (!view_matches(&view, targets_a) &&
                      !view_matches(&view, targets_b)) {
                      atomic_fetch_add_explicit(
                          &stress_mixed_views, 1U, memory_order_relaxed);
                  }
          '''
          new = '''        cvite_function_pointer observed[STRESS_SLOT_COUNT];
                  uint64_t before = cvite_runtime_generation(stress_runtime);
                  size_t index = 0U;
                  bool matches_a = true;
                  bool matches_b = true;
                  for (index = 0U; index < STRESS_SLOT_COUNT; ++index) {
                      observed[index] = cvite_runtime_target_at(
                          stress_runtime, stress_slots[index]);
                  }
                  if (before != cvite_runtime_generation(stress_runtime)) {
                      continue;
                  }
                  for (index = 0U; index < STRESS_SLOT_COUNT; ++index) {
                      matches_a = matches_a && observed[index] == targets_a[index];
                      matches_b = matches_b && observed[index] == targets_b[index];
                  }
                  if (!matches_a && !matches_b) {
                      atomic_fetch_add_explicit(
                          &stress_mixed_views, 1U, memory_order_relaxed);
                  }
          '''
          if old in text:
              text = text.replace(old, new, 1)
              start = text.find('static bool view_matches(')
              if start >= 0:
                  end = text.find('\n}\n', start)
                  if end < 0:
                      raise SystemExit('view_matches closing brace was not found')
                  text = text[:start] + text[end + 3:]
              stress.write_text(text, encoding='utf-8')

          path = Path('CMakeLists.txt')
          text = path.read_text(encoding='utf-8')
          option_anchor = 'option(CVITE_BUILD_EXAMPLES "Build CVite examples" ON)\n'
          if 'CVITE_BUILD_SOAK_TESTS' not in text:
              if option_anchor not in text:
                  raise SystemExit('CMake option anchor was not found')
              text = text.replace(
                  option_anchor,
                  option_anchor +
                  'option(CVITE_BUILD_SOAK_TESTS '
                  '"Build long-running live-refresh soak tests" OFF)\n',
                  1,
              )

          if 'cvite_test_runtime_stress' not in text:
              anchor = '''    add_executable(cvite_test_concurrency tests/test_concurrency.c)
              target_link_libraries(cvite_test_concurrency PRIVATE cvite::runtime Threads::Threads)
              cvite_set_warnings(cvite_test_concurrency)
              add_test(NAME concurrency COMMAND cvite_test_concurrency)
              set_tests_properties(concurrency PROPERTIES TIMEOUT 30)
          '''
              if anchor not in text:
                  raise SystemExit('concurrency test anchor was not found')
              block = anchor + '''
              add_executable(cvite_test_runtime_stress tests/test_runtime_stress.c)
              target_link_libraries(
                  cvite_test_runtime_stress
                  PRIVATE cvite::runtime Threads::Threads
              )
              cvite_set_warnings(cvite_test_runtime_stress)
              add_test(NAME runtime-stress COMMAND cvite_test_runtime_stress)
              set_tests_properties(runtime-stress PROPERTIES TIMEOUT 45)
          '''
              text = text.replace(anchor, block, 1)

          if 'NAME run-live-refresh-soak' not in text:
              marker = '''if(CVITE_BUILD_EXAMPLES)
          '''
              if marker not in text:
                  raise SystemExit('post-runner CMake marker was not found')
              block = '''if(
              CVITE_BUILD_SOAK_TESTS AND
              CVITE_BUILD_LLVM_PASS AND
              CVITE_BUILD_ORC_LOADER AND
              BUILD_TESTING
          )
              add_test(
                  NAME run-live-refresh-soak
                  COMMAND
                      ${Python3_EXECUTABLE}
                      ${CMAKE_CURRENT_SOURCE_DIR}/tests/soak_live_refresh.py
                      $<TARGET_FILE:cvite>
              )
              set_tests_properties(
                  run-live-refresh-soak
                  PROPERTIES TIMEOUT 150
              )
          endif()

          ''' + marker
              text = text.replace(marker, block, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check

      - name: Install Clang and LLVM 18
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          ninja-build
          clang-18
          llvm-18
          llvm-18-dev
          libclang-18-dev
          python3

      - name: Configure
        run: >-
          cmake -S . -B build-stress -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCVITE_BUILD_COMPILER=ON
          -DCVITE_BUILD_LLVM_PASS=ON
          -DCVITE_BUILD_ORC_LOADER=ON
          -DCVITE_BUILD_SOAK_TESTS=ON
          -DCVITE_LIBCLANG_ROOT=/usr/lib/llvm-18
          -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          -DCVITE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build-stress --verbose

      - name: Test runtime stress
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build-stress --output-on-failure \
            -R 'runtime-stress|concurrency' \
            | tee /tmp/cvite-runtime-stress.txt

      - name: Test multithreaded live-refresh soak
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build-stress --output-on-failure \
            -R run-live-refresh-soak \
            | tee /tmp/cvite-live-soak.txt

      - name: Upload stress transcripts
        uses: actions/upload-artifact@v4
        with:
          name: cvite-refresh-stress-${{ github.sha }}
          path: |
            /tmp/cvite-runtime-stress.txt
            /tmp/cvite-live-soak.txt
          retention-days: 7
          if-no-files-found: error

      - name: Commit verified source and remove verifier
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- .github/workflows/land-stress-coverage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            CMakeLists.txt \
            tests/test_runtime_stress.c \
            tests/soak_live_refresh.py
          git rm --cached --ignore-unmatch \
            .github/workflows/land-stress-coverage.yml
          git diff --cached --check
          git commit -m 'test: add runtime and multithreaded refresh stress coverage'
          git fetch origin bootstrap/m0-runtime
          git rebase origin/bootstrap/m0-runtime
          git push origin HEAD:bootstrap/m0-runtime
