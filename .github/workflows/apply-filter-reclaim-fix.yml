name: Verify filtering and JIT reclamation with LLVM fixes

on:
  push:
    branches:
      - bootstrap/m0-runtime
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'bootstrap/m0-runtime'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Apply feature source and LLVM integration fixes
        shell: bash
        run: |
          set -euo pipefail
          cat .cvite/filter-reclaim.part-{00,01,02,03} > /tmp/filter-reclaim.b64
          base64 -d /tmp/filter-reclaim.b64 > /tmp/filter-reclaim.tar.gz
          echo "69522b79f126dfab43900b9dc587b6f6356388d9c2dc47cb3a4506514ab2bd89  /tmp/filter-reclaim.tar.gz" | sha256sum --check
          tar -xzf /tmp/filter-reclaim.tar.gz -C .

          git apply <<'PATCH'
          diff --git a/src/host/orc_loader.cpp b/src/host/orc_loader.cpp
          --- a/src/host/orc_loader.cpp
          +++ b/src/host/orc_loader.cpp
          @@ -43,9 +43,9 @@ struct HostFunction final {
           };
           
           struct PreparedFingerprint final {
          -    cvite_id id = CVITE_ID_ZERO;
          -    cvite_id implementation = CVITE_ID_ZERO;
          -    cvite_id previous_implementation = CVITE_ID_ZERO;
          +    cvite_id id{};
          +    cvite_id implementation{};
          +    cvite_id previous_implementation{};
               cvite_orc_generation previous_owner = CVITE_ORC_GENERATION_INVALID;
           };
           
          @@ -55,9 +55,9 @@ struct OwnerDelta final {
           };
           
           struct ActiveFunction final {
          -    cvite_id id = CVITE_ID_ZERO;
          -    cvite_id abi = CVITE_ID_ZERO;
          -    cvite_id implementation = CVITE_ID_ZERO;
          +    cvite_id id{};
          +    cvite_id abi{};
          +    cvite_id implementation{};
               cvite_orc_generation owner = CVITE_ORC_GENERATION_INVALID;
           };
          diff --git a/src/transform/baseline_manifest_pass.cpp b/src/transform/baseline_manifest_pass.cpp
          --- a/src/transform/baseline_manifest_pass.cpp
          +++ b/src/transform/baseline_manifest_pass.cpp
          @@ -38,7 +38,7 @@ struct BaselineFunction final {
               llvm::GlobalVariable *slot = nullptr;
               Hash128 identity;
               Hash128 abi;
          -    Hash128 implementation;
          +    Hash128 implementation_fingerprint;
               std::string debug_name;
           };
           
          @@ -272,9 +272,9 @@ llvm::GlobalVariable *createFunctionRecords(
                           llvm::ConstantInt::get(i64, function.abi.high),
                           llvm::ConstantInt::get(i64, function.abi.low),
                           llvm::ConstantInt::get(
          -                    i64, function.implementation.high),
          +                    i64, function.implementation_fingerprint.high),
                           llvm::ConstantInt::get(
          -                    i64, function.implementation.low),
          +                    i64, function.implementation_fingerprint.low),
                           function.implementation,
                           function.slot,
                           debug_name,
          diff --git a/src/transform/candidate_pass.cpp b/src/transform/candidate_pass.cpp
          --- a/src/transform/candidate_pass.cpp
          +++ b/src/transform/candidate_pass.cpp
          @@ -1,4 +1,5 @@
           #include "candidate_pass.h"
          +#include "cvite/candidate.h"
           #include "transform_support.h"
           
           #include "llvm/ADT/ArrayRef.h"
          diff --git a/src/transform/stable_entry_pass.cpp b/src/transform/stable_entry_pass.cpp
          --- a/src/transform/stable_entry_pass.cpp
          +++ b/src/transform/stable_entry_pass.cpp
          @@ -43,7 +43,7 @@ struct WrappedFunction final {
               llvm::GlobalVariable *slot = nullptr;
               Hash128 identity;
               Hash128 abi;
          -    Hash128 implementation;
          +    Hash128 implementation_fingerprint;
               std::string debug_name;
           };
           
          @@ -204,7 +204,7 @@ WrappedFunction wrapFunction(llvm::Module &module, llvm::Function &function)
                   cvite::transform::identitySeed(module, function, original_name));
               const Hash128 abi = cvite::transform::hash128(
                   cvite::transform::abiSeed(module, function));
          -    const Hash128 implementation = cvite::transform::hash128(
          +    const Hash128 implementation_fingerprint = cvite::transform::hash128(
                   cvite::transform::implementationSeed(function));
               const llvm::GlobalValue::LinkageTypes original_linkage = function.getLinkage();
               const llvm::GlobalValue::VisibilityTypes original_visibility =
          @@ -295,7 +295,7 @@ WrappedFunction wrapFunction(llvm::Module &module, llvm::Function &function)
               entry->setMetadata(
                   cvite::transform::kFunctionMetadata,
                   llvm::MDNode::get(context, entry_metadata));
          -    cvite::transform::setImplementationMetadata(function, implementation);
          +    cvite::transform::setImplementationMetadata(function, implementation_fingerprint);
           
               return {
                   &function,
          @@ -303,7 +303,7 @@ WrappedFunction wrapFunction(llvm::Module &module, llvm::Function &function)
                   slot,
                   identity,
                   abi,
          -        implementation,
          +        implementation_fingerprint,
                   original_name,
               };
           }
          diff --git a/src/transform/transform_support.h b/src/transform/transform_support.h
          --- a/src/transform/transform_support.h
          +++ b/src/transform/transform_support.h
          @@ -4,6 +4,7 @@
           #include "llvm/ADT/SmallString.h"
           #include "llvm/ADT/StringRef.h"
           #include "llvm/IR/Attributes.h"
          +#include "llvm/IR/Constants.h"
           #include "llvm/IR/DataLayout.h"
           #include "llvm/IR/Function.h"
           #include "llvm/IR/GlobalObject.h"
          PATCH

          git diff --check

      - name: Install validation toolchains
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          ninja-build
          gcc
          clang
          clang-18
          llvm-18
          llvm-18-dev
          libclang-18-dev
          python3
          cmake

      - name: Configure full LLVM build
        run: >-
          cmake -S . -B build-full -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCVITE_BUILD_COMPILER=ON
          -DCVITE_BUILD_LLVM_PASS=ON
          -DCVITE_BUILD_ORC_LOADER=ON
          -DCVITE_LIBCLANG_ROOT=/usr/lib/llvm-18
          -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          -DCVITE_WARNINGS_AS_ERRORS=ON

      - name: Build and test full LLVM pipeline
        run: |
          cmake --build build-full --verbose
          ctest --test-dir build-full --output-on-failure

      - name: Configure and test GCC runtime
        env:
          CC: gcc
        run: |
          cmake -S . -B build-gcc -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCVITE_WARNINGS_AS_ERRORS=ON
          cmake --build build-gcc --verbose
          ctest --test-dir build-gcc --output-on-failure

      - name: Configure and test sanitizer runtime
        env:
          CC: clang
          CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCVITE_WARNINGS_AS_ERRORS=ON
          cmake --build build-sanitize --verbose
          ctest --test-dir build-sanitize --output-on-failure

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            CMakeLists.txt \
            include/cvite/baseline.h \
            include/cvite/candidate.h \
            include/cvite/host.h \
            include/cvite/orc_loader.h \
            src/cli/watcher.c \
            src/host/host_runtime.c \
            src/host/orc_loader.cpp \
            src/transform/baseline_manifest_pass.cpp \
            src/transform/candidate_pass.cpp \
            src/transform/stable_entry_pass.cpp \
            src/transform/transform_support.h \
            tests/check_candidate.py \
            tests/check_stable_entry.py \
            tests/fixtures/stable_e2e_baseline.c \
            tests/fixtures/stable_e2e_candidate.c \
            tests/fixtures/filter_baseline.c \
            tests/fixtures/filter_candidate_one.c \
            tests/fixtures/filter_candidate_two.c \
            tests/test_candidate_filter.c \
            tests/test_host.c \
            tests/test_stable_entry.c

          git rm -- \
            .cvite/filter-reclaim.part-00 \
            .cvite/filter-reclaim.part-01 \
            .cvite/filter-reclaim.part-02 \
            .cvite/filter-reclaim.part-03 \
            .github/workflows/apply-filter-reclaim.yml \
            .github/workflows/apply-filter-reclaim-fix.yml \
            .github/workflows/source-snapshot-current.yml

          git diff --cached --check
          git commit -m "feat: filter unchanged patches and reclaim retired JIT code"
          git push origin HEAD:bootstrap/m0-runtime
