name: Verify restart-required native state boundaries

on:
  push:
    branches:
      - bootstrap/m0-runtime
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cvite-restart-boundaries
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'bootstrap/m0-runtime'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Apply readable source patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .cvite/restart-boundaries.patch
          git apply .cvite/restart-boundaries.patch
          git diff --check
          python3 -m py_compile tests/check_candidate_boundaries.py

      - name: Install build toolchains
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          ninja-build
          gcc
          g++
          clang-18
          llvm-18
          llvm-18-dev
          libclang-18-dev
          python3
          cmake

      - name: Verify GCC runtime build
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-gcc -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc \
            -DCVITE_WARNINGS_AS_ERRORS=ON
          cmake --build build-gcc --verbose
          ctest --test-dir build-gcc --output-on-failure

      - name: Verify Clang runtime build
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-clang -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCVITE_WARNINGS_AS_ERRORS=ON
          cmake --build build-clang --verbose
          ctest --test-dir build-clang --output-on-failure

      - name: Verify ASan and UBSan
        shell: bash
        run: |
          set -euo pipefail
          CFLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
          LDFLAGS='-fsanitize=address,undefined' \
          cmake -S . -B build-sanitize -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCVITE_WARNINGS_AS_ERRORS=ON
          cmake --build build-sanitize --verbose
          ASAN_OPTIONS=detect_leaks=1:strict_string_checks=1 \
          UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
          ctest --test-dir build-sanitize --output-on-failure

      - name: Verify full Clang and LLVM pipeline
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-llvm -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCVITE_BUILD_COMPILER=ON \
            -DCVITE_BUILD_LLVM_PASS=ON \
            -DCVITE_BUILD_ORC_LOADER=ON \
            -DCVITE_LIBCLANG_ROOT=/usr/lib/llvm-18 \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DCVITE_WARNINGS_AS_ERRORS=ON
          cmake --build build-llvm --verbose
          ctest --test-dir build-llvm --output-on-failure

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- \
            CMakeLists.txt \
            docs/candidate-objects.md \
            include/cvite/candidate.h \
            include/cvite/status.h \
            src/cli/watcher.c \
            src/host/orc_loader.cpp \
            src/runtime/status.c \
            src/transform/candidate_pass.cpp \
            tests/check_candidate_boundaries.py \
            tests/test_restart_boundary.c \
            tests/fixtures/restart_boundary_manifest.c \
            tests/fixtures/restart_constructor_candidate.c \
            tests/fixtures/restart_destructor_candidate.c \
            tests/fixtures/restart_tls_candidate.c

          git rm --ignore-unmatch -- \
            .cvite/restart-boundaries.patch \
            .github/workflows/apply-restart-boundaries.yml \
            .github/workflows/snapshot-managed-storage.yml

          git diff --cached --check
          git commit -m 'feat: restart safely for TLS and native lifecycle state'
          git push origin HEAD:bootstrap/m0-runtime
