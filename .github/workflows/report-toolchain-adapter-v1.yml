name: Report LLVM adapter implementation

on:
  push:
    branches:
      - bootstrap/m0-runtime

permissions:
  contents: write
  actions: read

concurrency:
  group: cvite-toolchain-adapter-v1
  cancel-in-progress: false

jobs:
  report:
    if: >-
      github.actor != 'github-actions[bot]' &&
      contains(github.event.head_commit.message, '[adapter-report-v1]')
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Inspect implementation result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin bootstrap/m0-runtime
          git reset --hard origin/bootstrap/m0-runtime

          success=true
          for path in \
            cmake/CViteLLVMAdapter.cmake \
            src/toolchain/llvm_adapter.h \
            src/toolchain/llvm_adapter_common.cpp \
            src/toolchain/adapters/llvm18.cpp \
            src/compiler/allocation_annotator.cpp \
            src/transform/managed_allocation_pass.cpp \
            scripts/cvite-doctor.py \
            docs/toolchain-compatibility.md; do
            if [[ ! -f "$path" ]]; then
              success=false
            fi
          done

          run_json=$(gh run list \
            --workflow implement-toolchain-adapters.yml \
            --branch bootstrap/m0-runtime \
            --limit 1 \
            --json databaseId,status,conclusion,url,headSha 2>/dev/null || printf '[]')
          printf '%s\n' "$run_json" > /tmp/adapter-run.json
          run_id=$(python3 - <<'PY'
          import json
          rows=json.load(open('/tmp/adapter-run.json'))
          print(rows[0]['databaseId'] if rows else '')
          PY
          )
          if [[ -n "$run_id" ]]; then
            gh run view "$run_id" --log-failed > /tmp/adapter-failed.log 2>&1 || true
          else
            : > /tmp/adapter-failed.log
          fi

          mkdir -p docs
          {
            echo '# LLVM adapter implementation gate'
            echo
            echo "- Branch head: \`$(git rev-parse HEAD)\`"
            echo "- Required source present: \`$success\`"
            echo "- Recorded at: \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`"
            echo
            echo '## Workflow record'
            echo
            echo '```json'
            cat /tmp/adapter-run.json
            echo '```'
            if [[ -s /tmp/adapter-failed.log ]]; then
              echo
              echo '## Failed log tail'
              echo
              echo '```text'
              tail -n 300 /tmp/adapter-failed.log
              echo '```'
            fi
          } > docs/toolchain-adapter-gate.md

          if [[ "$success" != true ]]; then
            echo 'Implementation source is incomplete.' >&2
          fi

      - name: Publish exact gate record
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- .github/workflows/report-toolchain-adapter-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/toolchain-adapter-gate.md
          git add -u -- .github/workflows/report-toolchain-adapter-v1.yml
          git diff --cached --check
          git commit -m "docs: record LLVM adapter implementation gate [skip-managed-consolidation]"
          git fetch origin bootstrap/m0-runtime
          git rebase origin/bootstrap/m0-runtime
          git push origin HEAD:bootstrap/m0-runtime
