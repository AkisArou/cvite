name: Consolidate typed allocation analysis

on:
  push:
    branches:
      - bootstrap/m0-runtime
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cvite-consolidate-lifecycle
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Apply every pending source layer
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            .cvite/apply-filter-reclaim.py \
            .cvite/apply-safety-boundaries.py \
            .cvite/apply-refresh-diagnostics.py \
            .github/next/apply-semantic-next.py \
            .github/next/apply-semantic-fixes.py \
            .github/managed-next/apply-managed-memory.py \
            .github/allocation-next/apply-allocation-index.py
          do
            if [[ -f "$script" ]]; then
              echo "Applying $script"
              python3 "$script"
            fi
          done
          git diff --check

      - name: Require coherent source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f include/cvite/semantic_index.hpp
          test -f src/compiler/semantic_index.cpp
          test -f include/cvite/managed_memory.h
          test -f src/runtime/managed_memory.c
          test -f include/cvite/allocation_index.hpp
          test -f src/compiler/allocation_index.cpp
          test -f tests/test_allocation_index.cpp
          grep -q 'allocation_index.cpp' cmake/CViteSemantic.cmake
          grep -q 'CViteManagedMemory.cmake' CMakeLists.txt

      - name: Install pinned toolchain
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          ninja-build
          clang-18
          llvm-18
          llvm-18-dev
          libclang-18-dev
          python3
          cmake

      - name: Configure
        run: >-
          cmake -S . -B build-allocation -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCVITE_BUILD_COMPILER=ON
          -DCVITE_BUILD_LLVM_PASS=ON
          -DCVITE_BUILD_ORC_LOADER=ON
          -DCVITE_LIBCLANG_ROOT=/usr/lib/llvm-18
          -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          -DCVITE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build-allocation --verbose

      - name: Test complete suite
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build-allocation --output-on-failure \
            | tee /tmp/cvite-allocation-tests.txt

      - name: Exercise allocation CLI
        shell: bash
        run: |
          set -euo pipefail
          tool=build-allocation/cvite-allocation-index
          "$tool" index \
            --source tests/fixtures/allocation_sites.c \
            --output /tmp/allocation-sites.cvaidx \
            -- -std=c11
          "$tool" show --index /tmp/allocation-sites.cvaidx \
            | tee /tmp/allocation-sites.txt
          grep -q 'malloc type=Player' /tmp/allocation-sites.txt
          grep -q 'calloc type=Player' /tmp/allocation-sites.txt
          grep -q 'malloc type=? confidence=unknown' /tmp/allocation-sites.txt

      - name: Remove all one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- \
            .cvite \
            .github/next \
            .github/managed-next \
            .github/allocation-next
          find .github/workflows -maxdepth 1 -type f ! -name ci.yml -delete
          git diff --check

      - name: Commit verified source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            CMakeLists.txt \
            CMakePresets.json \
            README.md \
            cmake \
            docs \
            examples \
            include \
            scripts \
            src \
            tests
          git add -u -- .github .cvite || true
          git diff --cached --check
          git commit -m "feat: add Clang typed-allocation provenance index"
          git push origin HEAD:bootstrap/m0-runtime
