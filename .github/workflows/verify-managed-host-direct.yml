name: Verify and land managed host bridge

on:
  push:
    branches:
      - bootstrap/m0-runtime
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cvite-managed-host-direct
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Install compilers and build tools
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          cmake
          ninja-build
          gcc
          clang

      - name: Wire the managed host bridge into the runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          header = Path("include/cvite/managed_memory.h")
          content = header.read_text(encoding="utf-8")
          if "CVITE_MANAGED_STATUS_BUSY" not in content:
              marker = "    CVITE_MANAGED_STATUS_INVALID_COPY_PLAN\n"
              if marker not in content:
                  raise SystemExit("managed status marker is missing")
              content = content.replace(
                  marker,
                  "    CVITE_MANAGED_STATUS_INVALID_COPY_PLAN,\n"
                  "    CVITE_MANAGED_STATUS_BUSY\n",
                  1,
              )
          header.write_text(content, encoding="utf-8")

          runtime = Path("src/runtime/managed_memory.c")
          content = runtime.read_text(encoding="utf-8")
          if 'return "managed runtime is busy";' not in content:
              marker = (
                  "    case CVITE_MANAGED_STATUS_INVALID_COPY_PLAN:\n"
                  "        return \"invalid copy plan\";\n"
              )
              if marker not in content:
                  raise SystemExit("managed status-string marker is missing")
              content = content.replace(
                  marker,
                  marker
                  + "    case CVITE_MANAGED_STATUS_BUSY:\n"
                    "        return \"managed runtime is busy\";\n",
                  1,
              )
          runtime.write_text(content, encoding="utf-8")

          cmake = Path("CMakeLists.txt")
          content = cmake.read_text(encoding="utf-8")
          if "src/host/managed_host.c" not in content:
              marker = "add_library(cvite_host STATIC src/host/host_runtime.c)\n"
              if marker not in content:
                  raise SystemExit("host target marker is missing")
              content = content.replace(
                  marker,
                  marker
                  + "target_sources(cvite_host PRIVATE src/host/managed_host.c)\n",
                  1,
              )
          if "cvite_test_managed_host" not in content:
              marker = "    add_executable(cvite_test_host tests/test_host.c)\n"
              block = """    add_executable(cvite_test_managed_host tests/test_managed_host.c)
              target_link_libraries(cvite_test_managed_host PRIVATE cvite::host)
              cvite_set_warnings(cvite_test_managed_host)
              add_test(NAME managed-host COMMAND cvite_test_managed_host)

          """
              if marker not in content:
                  raise SystemExit("host test marker is missing")
              content = content.replace(marker, block + marker, 1)
          cmake.write_text(content, encoding="utf-8")
          PY
          git diff --check

      - name: Configure GCC
        run: >-
          cmake -S . -B build-host-gcc -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=gcc
          -DCVITE_WARNINGS_AS_ERRORS=ON
          -DCVITE_BUILD_COMPILER=OFF
          -DCVITE_BUILD_LLVM_PASS=OFF
          -DCVITE_BUILD_ORC_LOADER=OFF

      - name: Build and test GCC
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-host-gcc --verbose 2>&1 | tee /tmp/gcc-build.log
          ctest --test-dir build-host-gcc --output-on-failure 2>&1 | tee /tmp/gcc-test.log

      - name: Configure Clang
        run: >-
          cmake -S . -B build-host-clang -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang
          -DCVITE_WARNINGS_AS_ERRORS=ON
          -DCVITE_BUILD_COMPILER=OFF
          -DCVITE_BUILD_LLVM_PASS=OFF
          -DCVITE_BUILD_ORC_LOADER=OFF

      - name: Build and test Clang
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-host-clang --verbose 2>&1 | tee /tmp/clang-build.log
          ctest --test-dir build-host-clang --output-on-failure 2>&1 | tee /tmp/clang-test.log

      - name: Configure ASan and UBSan
        run: >-
          cmake -S . -B build-host-sanitizers -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang
          -DCVITE_WARNINGS_AS_ERRORS=ON
          '-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer'
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
          -DCVITE_BUILD_COMPILER=OFF
          -DCVITE_BUILD_LLVM_PASS=OFF
          -DCVITE_BUILD_ORC_LOADER=OFF

      - name: Build and test ASan and UBSan
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          set -o pipefail
          cmake --build build-host-sanitizers --verbose 2>&1 | tee /tmp/sanitizer-build.log
          ctest --test-dir build-host-sanitizers --output-on-failure 2>&1 | tee /tmp/sanitizer-test.log

      - name: Configure GCC analyzer
        run: >-
          cmake -S . -B build-host-analyzer -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=gcc
          -DCVITE_WARNINGS_AS_ERRORS=ON
          -DCMAKE_C_FLAGS=-fanalyzer
          -DCVITE_BUILD_COMPILER=OFF
          -DCVITE_BUILD_LLVM_PASS=OFF
          -DCVITE_BUILD_ORC_LOADER=OFF

      - name: Build with GCC analyzer
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-host-analyzer --verbose 2>&1 | tee /tmp/analyzer-build.log

      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- CMakeLists.txt include/cvite/managed_memory.h src/runtime/managed_memory.c
          git rm -- .github/workflows/verify-managed-host-direct.yml
          git diff --cached --check
          git commit -m "feat: integrate managed migration with host quiescence [skip-managed-consolidation]"
          git fetch origin bootstrap/m0-runtime
          git rebase origin/bootstrap/m0-runtime
          git push origin HEAD:bootstrap/m0-runtime

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cvite-managed-host-${{ github.sha }}
          path: |
            /tmp/gcc-build.log
            /tmp/gcc-test.log
            /tmp/clang-build.log
            /tmp/clang-test.log
            /tmp/sanitizer-build.log
            /tmp/sanitizer-test.log
            /tmp/analyzer-build.log
          retention-days: 7
          if-no-files-found: warn
