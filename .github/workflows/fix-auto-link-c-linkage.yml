name: Fix automatic native link C ABI

on:
  push:
    branches:
      - bootstrap/m0-runtime
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cvite-automatic-link-discovery
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Keep the generated interface on the C ABI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          block = '''int cvite_native_link_prepare(
              cvite_orc_loader *loader,
              const char *source_path,
              const char *clang_path);

          int cvite_native_link_check(
              cvite_orc_loader *loader,
              const char *source_path,
              const char *clang_path);

          int cvite_native_link_poll(
              cvite_orc_loader *loader,
              const char *source_path,
              const char *clang_path);
          '''
          wrapped = '''#ifdef __cplusplus
          extern "C" {
          #endif

          ''' + block + '''
          #ifdef __cplusplus
          }
          #endif
          '''

          changed = False
          for path in [Path('.cvite/apply-auto-link.py'), Path('src/cli/run_internal.h')]:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              if block in text and wrapped not in text:
                  path.write_text(text.replace(block, wrapped, 1), encoding='utf-8')
                  changed = True

          Path('.github/workflows/fix-auto-link-c-linkage.yml').unlink()
          print('changed=', changed)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .cvite/apply-auto-link.py src/cli/run_internal.h 2>/dev/null || true
          git rm --cached --ignore-unmatch .github/workflows/fix-auto-link-c-linkage.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: keep automatic link hooks on the C ABI"
          git push origin HEAD:bootstrap/m0-runtime
