name: Apply verified managed-memory core

on:
  push:
    branches:
      - bootstrap/m0-runtime

permissions:
  contents: write

concurrency:
  group: cvite-managed-core-direct
  cancel-in-progress: false

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-managed-core]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Materialize verified source
        shell: bash
        run: |
          set -euo pipefail
          cat .cvite/managed-core.part-* | base64 -d > /tmp/managed-core.tar.gz
          echo "ef0fab6856ef460477b4dd3003208e942be92477167e02035f9a092659a8aa6d  /tmp/managed-core.tar.gz" | sha256sum --check
          tar -xzf /tmp/managed-core.tar.gz -C .
          rm -rf -- .github/managed-next
          rm -f -- .cvite/managed-core.part-* .github/workflows/apply-managed-core-direct.yml
          rmdir .cvite 2>/dev/null || true
          git diff --check

      - name: Install development compilers
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          ninja-build
          cmake
          gcc
          clang

      - name: Verify GCC build
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-gcc -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc \
            -DCVITE_WARNINGS_AS_ERRORS=ON \
            -DCVITE_BUILD_COMPILER=OFF \
            -DCVITE_BUILD_LLVM_PASS=OFF \
            -DCVITE_BUILD_ORC_LOADER=OFF
          cmake --build build-gcc --verbose
          ctest --test-dir build-gcc --output-on-failure

      - name: Verify Clang build
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-clang -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCVITE_WARNINGS_AS_ERRORS=ON \
            -DCVITE_BUILD_COMPILER=OFF \
            -DCVITE_BUILD_LLVM_PASS=OFF \
            -DCVITE_BUILD_ORC_LOADER=OFF
          cmake --build build-clang --verbose
          ctest --test-dir build-clang --output-on-failure

      - name: Verify ASan and UBSan
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-sanitized -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined' \
            -DCVITE_WARNINGS_AS_ERRORS=ON \
            -DCVITE_BUILD_COMPILER=OFF \
            -DCVITE_BUILD_LLVM_PASS=OFF \
            -DCVITE_BUILD_ORC_LOADER=OFF
          cmake --build build-sanitized --verbose
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1 \
            ctest --test-dir build-sanitized --output-on-failure

      - name: Run GCC static analyzer
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -D_POSIX_C_SOURCE=200112L -Iinclude \
            -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            -Wformat=2 -Wundef -Werror -fanalyzer \
            -c src/runtime/managed_memory.c -o /tmp/managed-memory.o
          gcc -std=c11 -Iinclude \
            -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            -Wformat=2 -Wundef -Werror -fanalyzer \
            -c tests/test_managed_memory.c -o /tmp/test-managed-memory.o

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            CMakeLists.txt \
            cmake/CViteManagedMemory.cmake \
            docs/managed-memory.md \
            include/cvite/managed_memory.h \
            src/runtime/managed_memory.c \
            tests/test_managed_memory.c
          git add -u -- .github/managed-next .github/workflows .cvite
          git diff --cached --check
          git commit -m "feat: add failure-atomic managed memory migration"
          git push origin HEAD:bootstrap/m0-runtime
