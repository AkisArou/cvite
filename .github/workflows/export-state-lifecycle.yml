name: Export state lifecycle archive for recovery

on:
  push:
    branches:
      - bootstrap/m0-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Reconstruct surviving archive stream
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .cvite/state-lifecycle.part-00s0 \
            .cvite/state-lifecycle.part-00s1 \
            .cvite/state-lifecycle.part-00s2 \
            .cvite/state-lifecycle.part-00s3 \
            .cvite/state-lifecycle.part-01 \
            .cvite/state-lifecycle.part-02a \
            .cvite/state-lifecycle.part-02b \
            .cvite/state-lifecycle.part-03 \
            .cvite/state-lifecycle.part-04 \
            .cvite/state-lifecycle.part-05 \
            .cvite/state-lifecycle.part-06a \
            > /tmp/state-lifecycle.b64
          base64 -d /tmp/state-lifecycle.b64 > /tmp/state-lifecycle-truncated.tar.gz
          sha256sum /tmp/state-lifecycle-truncated.tar.gz > /tmp/state-lifecycle.sha256

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: cvite-state-lifecycle-recovery-${{ github.sha }}
          path: |
            /tmp/state-lifecycle-truncated.tar.gz
            /tmp/state-lifecycle.sha256
          retention-days: 1
          if-no-files-found: error
