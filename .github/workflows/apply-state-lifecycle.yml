name: Apply verified state lifecycle implementation

on:
  push:
    branches:
      - bootstrap/m0-runtime
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'bootstrap/m0-runtime'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Apply verified source archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .cvite/state-lifecycle.part-00s0 \
            .cvite/state-lifecycle.part-00s1 \
            .cvite/state-lifecycle.part-00s2 \
            .cvite/state-lifecycle.part-00s3 \
            .cvite/state-lifecycle.part-01 \
            .cvite/state-lifecycle.part-02a \
            .cvite/state-lifecycle.part-02b \
            .cvite/state-lifecycle.part-03 \
            .cvite/state-lifecycle.part-04 \
            .cvite/state-lifecycle.part-05 \
            .cvite/state-lifecycle.part-06a \
            > /tmp/state-lifecycle.b64
          base64 -d /tmp/state-lifecycle.b64 > /tmp/state-lifecycle.tar.gz
          sha256sum /tmp/state-lifecycle.tar.gz
          gzip -t /tmp/state-lifecycle.tar.gz
          tar -tzf /tmp/state-lifecycle.tar.gz > /tmp/state-lifecycle-files.txt
          test -s /tmp/state-lifecycle-files.txt
          tar -xzf /tmp/state-lifecycle.tar.gz -C .
          git diff --check

      - name: Install build toolchains
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          ninja-build
          gcc
          g++
          clang-18
          llvm-18
          llvm-18-dev
          libclang-18-dev
          python3
          cmake

      - name: Verify GCC runtime build
        shell: bash
        run: |
          set -euo pipefail
          CC=gcc cmake -S . -B build-gcc -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCVITE_WARNINGS_AS_ERRORS=ON
          cmake --build build-gcc --verbose
          ctest --test-dir build-gcc --output-on-failure

      - name: Verify Clang runtime build
        shell: bash
        run: |
          set -euo pipefail
          CC=clang-18 cmake -S . -B build-clang -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCVITE_WARNINGS_AS_ERRORS=ON
          cmake --build build-clang --verbose
          ctest --test-dir build-clang --output-on-failure

      - name: Verify sanitizers
        shell: bash
        run: |
          set -euo pipefail
          CC=clang-18 \
          CFLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
          LDFLAGS="-fsanitize=address,undefined" \
          cmake -S . -B build-sanitize -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCVITE_WARNINGS_AS_ERRORS=ON
          cmake --build build-sanitize --verbose
          ASAN_OPTIONS=detect_leaks=1:strict_string_checks=1 \
          UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
          ctest --test-dir build-sanitize --output-on-failure

      - name: Verify full Clang LLVM pipeline
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-state -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCVITE_BUILD_COMPILER=ON \
            -DCVITE_BUILD_LLVM_PASS=ON \
            -DCVITE_BUILD_ORC_LOADER=ON \
            -DCVITE_LIBCLANG_ROOT=/usr/lib/llvm-18 \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DCVITE_WARNINGS_AS_ERRORS=ON
          cmake --build build-state --verbose
          ctest --test-dir build-state --output-on-failure

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            CMakeLists.txt \
            README.md \
            docs/candidate-objects.md \
            docs/dev-server.md \
            docs/manifest.md \
            include/cvite/candidate.h \
            include/cvite/host.h \
            include/cvite/runtime.h \
            include/cvite/status.h \
            src/cli/native_link.cpp \
            src/cli/run.c \
            src/cli/run_internal.h \
            src/cli/toolchain.c \
            src/cli/watcher.c \
            src/compiler/manifest_diff.ipp \
            src/compiler/manifest_index.ipp \
            src/compiler/manifest_main.cpp \
            src/compiler/manifest_support.ipp \
            src/host/host_runtime.c \
            src/host/orc_loader.cpp \
            src/runtime/runtime_core.c \
            src/runtime/runtime_function.c \
            src/runtime/runtime_internal.h \
            src/runtime/status.c \
            src/transform/candidate_pass.cpp \
            tests/check_layout_report_restart.py \
            tests/check_manifest_diff.py \
            tests/check_restart_boundary.py \
            tests/fixtures/constructor_restart.c \
            tests/fixtures/layout_restart.c \
            tests/fixtures/manifest_diff_append.c \
            tests/fixtures/manifest_diff_before.c \
            tests/fixtures/manifest_diff_breaking.c \
            tests/fixtures/tls_restart.c \
            tests/test_concurrency.c \
            tests/test_runtime.c

          git rm -- \
            .cvite/state-lifecycle.part-00 \
            .cvite/state-lifecycle.part-00s0 \
            .cvite/state-lifecycle.part-00s1 \
            .cvite/state-lifecycle.part-00s2 \
            .cvite/state-lifecycle.part-00s3 \
            .cvite/state-lifecycle.part-01 \
            .cvite/state-lifecycle.part-02a \
            .cvite/state-lifecycle.part-02b \
            .cvite/state-lifecycle.part-03 \
            .cvite/state-lifecycle.part-04 \
            .cvite/state-lifecycle.part-05 \
            .cvite/state-lifecycle.part-06a \
            .github/workflows/apply-state-lifecycle.yml

          git diff --cached --check
          git commit -m "feat: add state-aware refresh diagnostics and lifecycle reclamation"
          git push origin HEAD:bootstrap/m0-runtime
