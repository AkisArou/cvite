name: Land managed layout migration planner

on:
  push:
    branches:
      - bootstrap/m0-runtime
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cvite-layout-planner
  cancel-in-progress: false

jobs:
  verify-and-land:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Wire layout planner into the build
        shell: bash
        run: |
          set -euo pipefail
          test -f src/compiler/semantic_index.h
          test -f src/compiler/layout_plan.h
          test -f src/compiler/layout_plan.cpp
          test -f src/compiler/layout_plan_main.cpp
          test -f tests/test_layout_plan.cpp

          python3 - <<'PY'
          from pathlib import Path

          path = Path('CMakeLists.txt')
          text = path.read_text(encoding='utf-8')

          if 'add_library(cvite_layout_plan STATIC' not in text:
              anchor = '''    add_executable(cvite_semantic_index_cli
                  src/compiler/semantic_index_main.cpp
              )'''
              if anchor not in text:
                  raise SystemExit('semantic-index executable anchor was not found')
              block = '''    add_library(cvite_layout_plan STATIC
                  src/compiler/layout_plan.cpp
              )
              target_include_directories(cvite_layout_plan
                  PUBLIC ${CMAKE_CURRENT_SOURCE_DIR}/src/compiler
              )
              target_link_libraries(
                  cvite_layout_plan
                  PUBLIC cvite_semantic_index
              )
              cvite_set_warnings(cvite_layout_plan)

              add_executable(cvite_layout_plan_cli
                  src/compiler/layout_plan_main.cpp
              )
              set_target_properties(
                  cvite_layout_plan_cli
                  PROPERTIES OUTPUT_NAME cvite-layout-plan
              )
              target_link_libraries(
                  cvite_layout_plan_cli
                  PRIVATE cvite_layout_plan
              )
              cvite_set_warnings(cvite_layout_plan_cli)
              install(
                  TARGETS cvite_layout_plan_cli
                  RUNTIME DESTINATION ${CMAKE_INSTALL_BINDIR}
              )

          ''' + anchor
              text = text.replace(anchor, block, 1)

          if 'NAME layout-plan' not in text:
              anchor = '''        add_test(
                  NAME semantic-index
                  COMMAND
                      ${Python3_EXECUTABLE}
                      ${CMAKE_CURRENT_SOURCE_DIR}/tests/check_semantic_index.py
                      $<TARGET_FILE:cvite_semantic_index_cli>
              )
          '''
              if anchor not in text:
                  raise SystemExit('semantic-index test anchor was not found')
              block = anchor + '''        add_executable(
                  cvite_test_layout_plan
                  tests/test_layout_plan.cpp
              )
              target_link_libraries(
                  cvite_test_layout_plan
                  PRIVATE cvite_layout_plan
              )
              cvite_set_warnings(cvite_test_layout_plan)
              add_test(NAME layout-plan COMMAND cvite_test_layout_plan)
          '''
              text = text.replace(anchor, block, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check

      - name: Install Clang and LLVM 18
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          ninja-build
          clang-18
          llvm-18
          llvm-18-dev
          libclang-18-dev
          python3

      - name: Configure
        run: >-
          cmake -S . -B build-layout -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCVITE_BUILD_COMPILER=ON
          -DCVITE_BUILD_LLVM_PASS=ON
          -DCVITE_BUILD_ORC_LOADER=ON
          -DCVITE_LIBCLANG_ROOT=/usr/lib/llvm-18
          -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          -DCVITE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build-layout --verbose

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build-layout --output-on-failure \
            | tee /tmp/cvite-layout-tests.txt

      - name: Upload verification transcript
        uses: actions/upload-artifact@v4
        with:
          name: cvite-layout-plan-${{ github.sha }}
          path: /tmp/cvite-layout-tests.txt
          retention-days: 7
          if-no-files-found: error

      - name: Commit verified source and remove verifier
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- .github/workflows/land-layout-planner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            CMakeLists.txt \
            src/compiler/layout_plan.h \
            src/compiler/layout_plan.cpp \
            src/compiler/layout_plan_main.cpp \
            tests/test_layout_plan.cpp
          git rm --cached --ignore-unmatch \
            .github/workflows/land-layout-planner.yml
          git diff --cached --check
          git commit -m 'feat: plan safe append-only managed storage migrations'
          git fetch origin bootstrap/m0-runtime
          git rebase origin/bootstrap/m0-runtime
          git push origin HEAD:bootstrap/m0-runtime
