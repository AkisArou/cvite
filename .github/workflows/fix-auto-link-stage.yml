name: Harden automatic native link implementation

on:
  push:
    branches:
      - bootstrap/m0-runtime
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cvite-automatic-link-discovery
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Apply portability fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path('.cvite/apply-auto-link.py'),
              Path('src/cli/native_link.cpp'),
          ]
          old_pipe = '''    if (pipe2(descriptors, O_CLOEXEC) != 0) {
                  return std::nullopt;
              }

              posix_spawn_file_actions_t actions;'''
          new_pipe = '''    if (pipe(descriptors) != 0) {
                  return std::nullopt;
              }
              (void)fcntl(descriptors[0], F_SETFD, FD_CLOEXEC);
              (void)fcntl(descriptors[1], F_SETFD, FD_CLOEXEC);

              posix_spawn_file_actions_t actions;'''
          old_hash = '''    for (unsigned char byte : text) {
                  value ^= static_cast<std::uint64_t>(byte);
                  value *= prime;
              }'''
          new_hash = '''    for (char character : text) {
                  const auto byte = static_cast<unsigned char>(character);
                  value ^= static_cast<std::uint64_t>(byte);
                  value *= prime;
              }'''

          changed = False
          for path in candidates:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text.replace(old_pipe, new_pipe).replace(old_hash, new_hash)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed = True

          Path('.github/workflows/fix-auto-link-stage.yml').unlink()
          print('changed=', changed)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .cvite/apply-auto-link.py src/cli/native_link.cpp 2>/dev/null || true
          git rm --cached --ignore-unmatch .github/workflows/fix-auto-link-stage.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: harden automatic link discovery portability"
          git push origin HEAD:bootstrap/m0-runtime
