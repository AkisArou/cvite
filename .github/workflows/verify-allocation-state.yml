name: Verify allocation provenance source

on:
  push:
    branches:
      - bootstrap/m0-runtime
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cvite-consolidate-lifecycle
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Require consolidated source only
        shell: bash
        run: |
          set -euo pipefail
          test -f include/cvite/semantic_index.hpp
          test -f include/cvite/managed_memory.h
          test -f include/cvite/allocation_index.hpp
          test -f src/compiler/allocation_index.cpp
          test -f tests/test_allocation_index.cpp
          test ! -d .cvite
          test ! -d .github/next
          test ! -d .github/managed-next
          test ! -d .github/allocation-next

      - name: Install Clang and LLVM 18
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          ninja-build
          clang-18
          llvm-18
          llvm-18-dev
          libclang-18-dev
          python3
          cmake

      - name: Configure
        run: >-
          cmake -S . -B build-allocation-verified -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCVITE_BUILD_COMPILER=ON
          -DCVITE_BUILD_LLVM_PASS=ON
          -DCVITE_BUILD_ORC_LOADER=ON
          -DCVITE_LIBCLANG_ROOT=/usr/lib/llvm-18
          -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          -DCVITE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build-allocation-verified --verbose

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build-allocation-verified --output-on-failure \
            | tee /tmp/cvite-allocation-verification.txt

      - name: Exercise semantic tools
        shell: bash
        run: |
          set -euo pipefail
          build-allocation-verified/cvite-allocation-index index \
            --source tests/fixtures/allocation_sites.c \
            --output /tmp/sites.cvaidx \
            -- -std=c11
          build-allocation-verified/cvite-allocation-index show \
            --index /tmp/sites.cvaidx \
            | tee /tmp/sites.txt
          grep -q 'confidence=sizeof-type' /tmp/sites.txt
          grep -q 'confidence=typed-result' /tmp/sites.txt
          grep -q 'confidence=unknown' /tmp/sites.txt

      - name: Record verified state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          {
            echo '# Allocation provenance verification'
            echo
            echo "- Tested commit: \`$(git rev-parse HEAD)\`"
            echo '- Toolchain: Clang/LLVM 18, Debug, warnings as errors'
            echo '- Complete CTest suite: **passed**'
            echo '- Clang record-layout index: **present**'
            echo '- Conservative append-only planner: **present**'
            echo '- Transactional managed-object registry: **present**'
            echo '- Clang allocation-site index: **present**'
            echo '- Recognized allocators: `malloc`, `calloc`, `realloc`, `aligned_alloc`'
            echo '- Typed-result and `sizeof(T)` inference: **verified**'
            echo '- Unknown allocation sites remain unknown: **verified**'
            echo
            echo '> Allocation-site type evidence is not sufficient for live migration. Pointer stores, escapes, foreign calls, and quiescence must also be proven or the edit restarts.'
            echo
            echo '## Full test transcript'
            echo
            echo '```text'
            cat /tmp/cvite-allocation-verification.txt
            echo '```'
            echo
            echo '## Indexed fixture sites'
            echo
            echo '```text'
            cat /tmp/sites.txt
            echo '```'
          } > docs/allocation-verification.md
          rm -f -- .github/workflows/verify-allocation-state.yml
          git diff --check

      - name: Commit verification record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/allocation-verification.md
          git add -u -- .github/workflows/verify-allocation-state.yml
          git diff --cached --check
          git commit -m "docs: record allocation provenance verification"
          git push origin HEAD:bootstrap/m0-runtime
