name: Promote allocation inference after managed core

on:
  push:
    branches:
      - bootstrap/m0-runtime

permissions:
  contents: write

concurrency:
  group: cvite-managed-pipeline-final
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.actor == 'github-actions[bot]' &&
      startsWith(github.event.head_commit.message, 'feat: add') &&
      contains(github.event.head_commit.message, 'managed') &&
      (contains(github.event.head_commit.message, 'memory') ||
       contains(github.event.head_commit.message, 'migration'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Require the verified managed runtime
        shell: bash
        run: |
          set -euo pipefail
          test -f include/cvite/managed_memory.h
          test -f src/runtime/managed_memory.c
          test -f tests/test_managed_memory.c
          grep -q 'cvite_managed_transaction_commit' include/cvite/managed_memory.h
          grep -q 'cvite_managed_pointer_patch' src/runtime/managed_memory.c

      - name: Promote the Clang allocation index
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/allocation-next/apply-allocation-index.py
          python3 .github/allocation-next/apply-allocation-index.py
          test -f include/cvite/allocation_index.hpp
          test -f src/compiler/allocation_index.cpp
          test -f src/compiler/allocation_index_main.cpp
          test -f tests/test_allocation_index.cpp
          test -f tests/fixtures/allocation_sites.c
          git diff --check

      - name: Install Clang and LLVM 18
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          ninja-build
          cmake
          clang-18
          llvm-18
          llvm-18-dev
          libclang-18-dev
          python3

      - name: Configure complete compiler build
        run: >-
          cmake -S . -B build-allocation-index -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCVITE_BUILD_COMPILER=ON
          -DCVITE_BUILD_LLVM_PASS=ON
          -DCVITE_BUILD_ORC_LOADER=ON
          -DCVITE_LIBCLANG_ROOT=/usr/lib/llvm-18
          -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          -DCVITE_WARNINGS_AS_ERRORS=ON

      - name: Build and test complete tree
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-allocation-index --verbose
          ctest --test-dir build-allocation-index --output-on-failure

      - name: Publish allocation inference only after verification
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- .github/allocation-next
          rm -f -- \
            .github/workflows/consolidate-allocation-index.yml \
            .github/workflows/promote-allocation-index-after-managed-core.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            CMakeLists.txt \
            docs/allocation-tracking.md \
            include/cvite/allocation_index.hpp \
            src/compiler/allocation_index.cpp \
            src/compiler/allocation_index_main.cpp \
            tests/test_allocation_index.cpp \
            tests/fixtures/allocation_sites.c
          git add -u -- \
            .github/allocation-next \
            .github/workflows/consolidate-allocation-index.yml \
            .github/workflows/promote-allocation-index-after-managed-core.yml
          git diff --cached --check
          git commit -m "feat: infer typed allocation sites with Clang [skip-managed-consolidation]"
          git fetch origin bootstrap/m0-runtime
          git rebase origin/bootstrap/m0-runtime
          git push origin HEAD:bootstrap/m0-runtime
