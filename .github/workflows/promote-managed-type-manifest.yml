name: Promote managed type manifests

on:
  push:
    branches:
      - bootstrap/m0-runtime

permissions:
  contents: write

concurrency:
  group: cvite-managed-pipeline-final
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.actor == 'github-actions[bot]' &&
      startsWith(github.event.head_commit.message,
                 'feat: instrument inferred managed allocations')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Promote type-manifest generation
        shell: bash
        run: |
          set -euo pipefail
          test -f src/compiler/allocation_annotator.cpp
          mapfile -t scripts < <(find .github/type-manifest-next -maxdepth 1 -type f -name 'apply-*.py' | sort)
          test "${#scripts[@]}" -eq 1
          python3 "${scripts[0]}"
          git diff --check

      - name: Validate generated source scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          fixed = {'CMakeLists.txt', 'CMakePresets.json', 'README.md'}
          roots = {'cmake', 'docs', 'examples', 'include', 'scripts', 'src', 'tests'}
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '--diff-filter=ACMRT'], text=True
          ).splitlines()
          selected = []
          for item in changed:
              path = Path(item)
              if item in fixed or (path.parts and path.parts[0] in roots):
                  selected.append(item)
              elif not item.startswith('.github/'):
                  raise SystemExit(f'unexpected type-manifest path: {item}')
          if not selected:
              raise SystemExit('type-manifest applicator produced no source changes')
          Path('/tmp/cvite-type-manifest-paths').write_text(
              '\n'.join(selected) + '\n', encoding='utf-8'
          )
          print('\n'.join(selected))
          PY

      - name: Install LLVM 18
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          ninja-build cmake clang-18 llvm-18 llvm-18-dev libclang-18-dev python3

      - name: Verify full tree
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-type-manifest -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCVITE_BUILD_COMPILER=ON \
            -DCVITE_BUILD_LLVM_PASS=ON \
            -DCVITE_BUILD_ORC_LOADER=ON \
            -DCVITE_LIBCLANG_ROOT=/usr/lib/llvm-18 \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DCVITE_WARNINGS_AS_ERRORS=ON
          cmake --build build-type-manifest --verbose
          ctest --test-dir build-type-manifest --output-on-failure

      - name: Publish verified type manifests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- .github/type-manifest-next
          rm -f -- \
            .github/workflows/consolidate-managed-type-manifest.yml \
            .github/workflows/promote-managed-type-manifest.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS= read -r path; do
            test -n "$path" && git add -- "$path"
          done < /tmp/cvite-type-manifest-paths
          git add -u -- \
            .github/type-manifest-next \
            .github/workflows/consolidate-managed-type-manifest.yml \
            .github/workflows/promote-managed-type-manifest.yml
          git diff --cached --check
          git commit -m "feat: emit managed type manifests [skip-managed-consolidation]"
          git fetch origin bootstrap/m0-runtime
          git rebase origin/bootstrap/m0-runtime
          git push origin HEAD:bootstrap/m0-runtime
