name: Finalize automatic native link discovery milestone

on:
  push:
    branches:
      - bootstrap/m0-runtime
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cvite-automatic-link-discovery-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Check verified milestone
        id: ready
        shell: bash
        run: |
          if [[ -f docs/native-link-discovery.md && ! -f .cvite/apply-auto-link.py ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update draft pull request
        if: steps.ready.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## Summary

          CVite now provides an end-to-end React/Vite-style Fast Refresh loop for ordinary C without requiring application macros, annotations, state wrappers, custom allocators, or lifecycle hooks.

          ```console
          cvite run .
          ```

          The current Linux/Clang 18 development path supports multi-translation-unit projects, incremental TU recompilation, changed-function-only publication, persistent globals/statics, compile-error recovery, controlled restart boundaries, quiescent JIT generation reclamation, and automatic native target/link-input discovery.

          ## Native project integration

          - `compile_commands.json` is read through libclang; CVite does not implement a C or JSON frontend.
          - CMake `CMakeFiles/<target>.dir/link.txt` commands are matched to the selected source target.
          - `-L`, `-l`, `-l:`, direct shared libraries, static archives, support objects, and rpath search hints are reconstructed automatically.
          - Dynamic libraries and archives are exposed through LLVM ORC namespaces shared by baseline and candidate generations.
          - Explicit target triples and `-m32`/`-m64` are checked against the in-process JIT target.
          - Target or link-plan changes trigger a controlled red-refresh restart.
          - `CVITE_PRELOAD` remains an override for plugin-owned and non-CMake libraries, rather than the common-path requirement.

          ## Refresh semantics

          - Compatible code edits atomically publish only changed implementations.
          - Source/header/compiler errors keep the last known-good generation active.
          - Function ABI, persistent-layout, TU-set, TLS, constructor/destructor, target, and native-link changes use safe restart fallback.
          - Active native stack frames are never rewritten.
          - Retired ORC generations are reclaimed only after generated call scopes report quiescence.

          ## Validation

          The suite exercises GCC, Clang, ASan/UBSan, LLVM 18 pass verification, ORC/JITLink, multi-TU invalidation, compile-command changes, shared headers, changed-function filtering, restart fallback, TLS boundaries, external libraries, quiescent reclamation, and an automatic-link integration project that runs with no `CVITE_PRELOAD`.

          ## Current constraints

          - Linux/inotify and Clang/LLVM 18.
          - C11 development builds at `-O0`.
          - No arbitrary live pointer-graph or layout migration.
          - CMake link-command discovery is the first automatic native-link backend; additional build-system backends remain future work.
          EOF
          gh pr edit 1 --repo AkisArou/cvite --body-file /tmp/pr-body.md

      - name: Remove finalizer
        if: steps.ready.outputs.value == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/finalize-auto-link-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --cached --ignore-unmatch .github/workflows/finalize-auto-link-pr.yml
          git commit -m "chore: finalize automatic native link milestone"
          git push origin HEAD:bootstrap/m0-runtime
