name: Implement LLVM adapters and managed instrumentation

on:
  push:
    branches:
      - bootstrap/m0-runtime

permissions:
  contents: write

concurrency:
  group: cvite-toolchain-adapter-v1
  cancel-in-progress: false

jobs:
  implement:
    if: >-
      github.actor != 'github-actions[bot]' &&
      contains(github.event.head_commit.message, '[implement-adapter-v1]')
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Install supported development toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            cmake \
            python3 \
            clang-18 \
            llvm-18 \
            llvm-18-dev \
            libclang-18-dev \
            lld-18

      - name: Promote staged compiler instrumentation
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f src/compiler/allocation_annotator.cpp ]]; then
            test -f .github/instrumentation-next/apply-managed-instrumentation.py
            python3 .github/instrumentation-next/apply-managed-instrumentation.py
          fi

          if [[ ! -f src/compiler/clang_wrapper.cpp ]]; then
            test -f .github/driver-next/apply-compiler-proxy.py
            python3 .github/driver-next/apply-compiler-proxy.py
          fi

          if [[ ! -f tests/check_managed_live.py && \
                -f .github/driver-next/apply-managed-live-test.py ]]; then
            python3 .github/driver-next/apply-managed-live-test.py
          fi

          git diff --check

      - name: Add versioned LLVM adapter boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/toolchain/adapters cmake scripts tests

          cat > src/toolchain/llvm_adapter.h <<'EOF'
          #ifndef CVITE_LLVM_ADAPTER_H
          #define CVITE_LLVM_ADAPTER_H

          #include <cstdint>
          #include <string_view>

          namespace cvite::toolchain {

          inline constexpr std::uint32_t llvm_adapter_abi = 1U;

          struct LLVMAdapterInfo final {
              std::uint32_t abi = llvm_adapter_abi;
              std::uint32_t llvm_major = 0U;
              std::string_view name;
              bool opaque_pointers_required = true;
              bool orc_jitlink_supported = true;
          };

          [[nodiscard]] const LLVMAdapterInfo &llvmAdapterInfo() noexcept;

          [[nodiscard]] bool isSupportedLLVMMajor(
              std::uint32_t major) noexcept;

          } // namespace cvite::toolchain

          #endif
          EOF

          cat > src/toolchain/llvm_adapter_common.cpp <<'EOF'
          #include "llvm_adapter.h"

          namespace cvite::toolchain {

          bool isSupportedLLVMMajor(std::uint32_t major) noexcept
          {
              return major == 18U || major == 19U || major == 20U;
          }

          } // namespace cvite::toolchain
          EOF

          for major in 18 19 20; do
            cat > "src/toolchain/adapters/llvm${major}.cpp" <<EOF
          #include "../llvm_adapter.h"

          #include "llvm/Config/llvm-config.h"

          static_assert(
              LLVM_VERSION_MAJOR == ${major},
              "CVite LLVM adapter was compiled against the wrong LLVM major");

          namespace cvite::toolchain {

          const LLVMAdapterInfo &llvmAdapterInfo() noexcept
          {
              static constexpr LLVMAdapterInfo info{
                  llvm_adapter_abi,
                  ${major}U,
                  "llvm${major}",
                  true,
                  true,
              };
              return info;
          }

          } // namespace cvite::toolchain
          EOF
          done

          cat > src/toolchain/llvm_adapter_info.cpp <<'EOF'
          #include "llvm_adapter.h"

          #include <cstdio>
          #include <cstring>

          int main(int argc, char **argv)
          {
              const cvite::toolchain::LLVMAdapterInfo &info =
                  cvite::toolchain::llvmAdapterInfo();
              const bool json = argc == 2 &&
                  std::strcmp(argv[1], "--json") == 0;

              if (argc > 2 || (argc == 2 && !json)) {
                  std::fprintf(
                      stderr,
                      "usage: cvite-llvm-adapter-info [--json]\n");
                  return 2;
              }

              if (json) {
                  std::printf(
                      "{\"adapter_abi\":%u,\"llvm_major\":%u,"
                      "\"adapter\":\"%.*s\",\"supported\":%s}\n",
                      info.abi,
                      info.llvm_major,
                      static_cast<int>(info.name.size()),
                      info.name.data(),
                      cvite::toolchain::isSupportedLLVMMajor(info.llvm_major)
                          ? "true"
                          : "false");
              } else {
                  std::printf("CVite LLVM adapter ABI: %u\n", info.abi);
                  std::printf("LLVM major: %u\n", info.llvm_major);
                  std::printf(
                      "Adapter: %.*s\n",
                      static_cast<int>(info.name.size()),
                      info.name.data());
                  std::printf(
                      "Status: %s\n",
                      cvite::toolchain::isSupportedLLVMMajor(info.llvm_major)
                          ? "compatible"
                          : "unsupported");
              }

              return cvite::toolchain::isSupportedLLVMMajor(info.llvm_major)
                  ? 0
                  : 1;
          }
          EOF

          cat > cmake/CViteLLVMAdapter.cmake <<'EOF'
          include_guard(GLOBAL)

          set(
              CVITE_SUPPORTED_LLVM_MAJORS
              "18;19;20"
              CACHE STRING
              "LLVM major releases supported by this CVite source tree"
          )

          function(cvite_target_use_llvm_adapter target)
              if(NOT TARGET "${target}")
                  message(FATAL_ERROR "CVite LLVM adapter target does not exist: ${target}")
              endif()
              target_link_libraries("${target}" PRIVATE cvite_llvm_adapter)
          endfunction()

          function(cvite_configure_llvm_adapter)
              if(TARGET cvite_llvm_adapter)
                  return()
              endif()

              if(NOT DEFINED LLVM_VERSION_MAJOR)
                  if(DEFINED LLVM_PACKAGE_VERSION)
                      string(
                          REGEX MATCH "^[0-9]+"
                          LLVM_VERSION_MAJOR
                          "${LLVM_PACKAGE_VERSION}"
                      )
                  else()
                      message(FATAL_ERROR
                          "LLVM was not found before configuring the CVite adapter")
                  endif()
              endif()

              list(
                  FIND
                  CVITE_SUPPORTED_LLVM_MAJORS
                  "${LLVM_VERSION_MAJOR}"
                  _cvite_llvm_index
              )
              if(_cvite_llvm_index EQUAL -1)
                  message(FATAL_ERROR
                      "Unsupported LLVM ${LLVM_VERSION_MAJOR}. "
                      "Supported majors: ${CVITE_SUPPORTED_LLVM_MAJORS}")
              endif()

              set(
                  _cvite_adapter_source
                  "${CMAKE_CURRENT_SOURCE_DIR}/src/toolchain/adapters/llvm${LLVM_VERSION_MAJOR}.cpp"
              )
              if(NOT EXISTS "${_cvite_adapter_source}")
                  message(FATAL_ERROR
                      "Missing CVite adapter source: ${_cvite_adapter_source}")
              endif()

              add_library(cvite_llvm_adapter STATIC
                  src/toolchain/llvm_adapter_common.cpp
                  "${_cvite_adapter_source}"
              )
              target_compile_features(cvite_llvm_adapter PUBLIC cxx_std_17)
              target_include_directories(cvite_llvm_adapter
                  PUBLIC
                      "${CMAKE_CURRENT_SOURCE_DIR}/src/toolchain"
                  PRIVATE
                      ${LLVM_INCLUDE_DIRS}
              )
              target_compile_definitions(cvite_llvm_adapter
                  PUBLIC
                      CVITE_LLVM_VERSION_MAJOR=${LLVM_VERSION_MAJOR}
              )
              target_compile_options(cvite_llvm_adapter PRIVATE
                  $<$<CXX_COMPILER_ID:GNU,Clang>:-Wall;-Wextra;-Wpedantic;-Wconversion;-Wshadow;-Wformat=2;-Wundef>
              )
              if(CVITE_WARNINGS_AS_ERRORS)
                  target_compile_options(cvite_llvm_adapter PRIVATE
                      $<$<CXX_COMPILER_ID:GNU,Clang>:-Werror>
                  )
              endif()

              add_executable(cvite_llvm_adapter_info
                  src/toolchain/llvm_adapter_info.cpp
              )
              set_target_properties(cvite_llvm_adapter_info PROPERTIES
                  OUTPUT_NAME cvite-llvm-adapter-info
              )
              target_compile_features(cvite_llvm_adapter_info PRIVATE cxx_std_17)
              target_link_libraries(cvite_llvm_adapter_info PRIVATE cvite_llvm_adapter)
              target_compile_options(cvite_llvm_adapter_info PRIVATE
                  $<$<CXX_COMPILER_ID:GNU,Clang>:-Wall;-Wextra;-Wpedantic;-Wconversion;-Wshadow;-Wformat=2;-Wundef>
              )
              if(CVITE_WARNINGS_AS_ERRORS)
                  target_compile_options(cvite_llvm_adapter_info PRIVATE
                      $<$<CXX_COMPILER_ID:GNU,Clang>:-Werror>
                  )
              endif()

              if(BUILD_TESTING)
                  add_test(
                      NAME llvm-adapter-info
                      COMMAND cvite_llvm_adapter_info --json
                  )
                  set_tests_properties(llvm-adapter-info PROPERTIES
                      PASS_REGULAR_EXPRESSION
                          "\\\"llvm_major\\\":${LLVM_VERSION_MAJOR}.*\\\"supported\\\":true"
                  )
              endif()

              foreach(_target IN ITEMS
                  cvite_llvm_pass
                  cvite_pass
                  cvite_lowering_pass
                  cvite_orc_loader
                  cvite_orc
              )
                  if(TARGET "${_target}")
                      cvite_target_use_llvm_adapter("${_target}")
                  endif()
              endforeach()

              message(STATUS
                  "CVite selected LLVM ${LLVM_VERSION_MAJOR} adapter")
          endfunction()
          EOF

          cat > scripts/cvite-doctor.py <<'EOF'
          #!/usr/bin/env python3
          """Validate the Clang/LLVM major pair used by a CVite development build."""

          from __future__ import annotations

          import argparse
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys

          SUPPORTED = (18, 19, 20)


          def major_from_command(command: str) -> tuple[int | None, str]:
              path = shutil.which(command) if os.sep not in command else command
              if not path:
                  return None, f"{command}: not found"
              try:
                  output = subprocess.check_output(
                      [path, "--version"],
                      text=True,
                      stderr=subprocess.STDOUT,
                  )
              except (OSError, subprocess.CalledProcessError) as error:
                  return None, f"{path}: {error}"
              match = re.search(r"(?:version\s+)(\d+)", output)
              if not match:
                  return None, f"{path}: unable to parse version"
              return int(match.group(1)), path


          def main() -> int:
              parser = argparse.ArgumentParser(prog="cvite-doctor")
              parser.add_argument(
                  "--clang",
                  default=os.environ.get("CVITE_CLANG", "clang"),
              )
              parser.add_argument(
                  "--llvm-config",
                  default=os.environ.get("CVITE_LLVM_CONFIG", "llvm-config"),
              )
              parser.add_argument("--json", action="store_true")
              args = parser.parse_args()

              clang_major, clang_path = major_from_command(args.clang)
              llvm_major, llvm_path = major_from_command(args.llvm_config)
              compatible = (
                  clang_major is not None
                  and llvm_major is not None
                  and clang_major == llvm_major
                  and llvm_major in SUPPORTED
              )
              adapter = f"llvm{llvm_major}" if llvm_major in SUPPORTED else None
              result = {
                  "clang": clang_path,
                  "clang_major": clang_major,
                  "llvm_config": llvm_path,
                  "llvm_major": llvm_major,
                  "supported_majors": list(SUPPORTED),
                  "adapter": adapter,
                  "compatible": compatible,
              }

              if args.json:
                  print(json.dumps(result, sort_keys=True))
              else:
                  print(f"Clang:        {clang_path}")
                  print(f"Clang major:  {clang_major}")
                  print(f"LLVM config:  {llvm_path}")
                  print(f"LLVM major:   {llvm_major}")
                  print(f"Adapter:      {adapter or 'unavailable'}")
                  print(f"Status:       {'compatible' if compatible else 'incompatible'}")
              return 0 if compatible else 1


          if __name__ == "__main__":
              sys.exit(main())
          EOF
          chmod +x scripts/cvite-doctor.py

          cat > tests/check_toolchain_doctor.py <<'EOF'
          from __future__ import annotations

          import json
          import subprocess
          import sys

          doctor, clang, llvm_config = sys.argv[1:4]
          output = subprocess.check_output(
              [
                  sys.executable,
                  doctor,
                  "--clang",
                  clang,
                  "--llvm-config",
                  llvm_config,
                  "--json",
              ],
              text=True,
          )
          result = json.loads(output)
          assert result["compatible"] is True, result
          assert result["clang_major"] == 18, result
          assert result["llvm_major"] == 18, result
          assert result["adapter"] == "llvm18", result
          EOF

          cat > docs/toolchain-compatibility.md <<'EOF'
          # LLVM and Clang compatibility

          LLVM 18 is CVite's first known-good toolchain pin. It is not a permanent
          language or runtime requirement.

          CVite's compiler extension uses Clang semantic APIs, LLVM pass APIs,
          and ORC/JITLink C++ APIs. These interfaces are versioned with LLVM and
          are not treated as a stable cross-major plugin ABI. A plugin compiled
          against one LLVM major must therefore be loaded by that same major.

          The shared CVite runtime, protocol, dependency graph, compatibility
          engine, and managed-memory code do not need one implementation per
          LLVM release. Version differences are isolated behind the adapter ABI
          in `src/toolchain/`.

          The currently declared adapter set is LLVM 18, 19, and 20. Each adapter
          is compiled and tested separately. Unsupported majors fail during
          configuration rather than risking a mismatched plugin or JIT runtime.

          ```console
          CVITE_CLANG=clang-18 \
          CVITE_LLVM_CONFIG=llvm-config-18 \
            python3 scripts/cvite-doctor.py
          ```

          The long-term distribution model is a private, pinned LLVM toolchain
          bundled with or downloaded by CVite. Production builds remain free to
          use the project's normal compiler.
          EOF

      - name: Wire adapter and doctor into CMake
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("CMakeLists.txt")
          text = path.read_text(encoding="utf-8")

          block = """

          # LLVM-major-specific APIs are isolated behind a thin adapter library.
          if(CVITE_BUILD_LLVM_PASS OR CVITE_BUILD_ORC_LOADER)
              include(cmake/CViteLLVMAdapter.cmake)
              cvite_configure_llvm_adapter()
          endif()

          if(BUILD_TESTING AND CVITE_BUILD_LLVM_PASS)
              find_package(Python3 REQUIRED COMPONENTS Interpreter)
              add_test(
                  NAME toolchain-doctor
                  COMMAND
                      "${Python3_EXECUTABLE}"
                      "${CMAKE_CURRENT_SOURCE_DIR}/tests/check_toolchain_doctor.py"
                      "${CMAKE_CURRENT_SOURCE_DIR}/scripts/cvite-doctor.py"
                      "${CMAKE_C_COMPILER}"
                      "/usr/bin/llvm-config-18"
              )
          endif()
          """

          if "include(cmake/CViteLLVMAdapter.cmake)" not in text:
              text = text.rstrip() + block + "\n"
              path.write_text(text, encoding="utf-8")

          readme = Path("README.md")
          readme_text = readme.read_text(encoding="utf-8")
          section = """

          ## Compiler compatibility

          LLVM 18 is the first known-good development-toolchain pin, not a
          permanent requirement. LLVM-major-specific Clang, pass-plugin, and
          ORC/JITLink APIs are isolated behind thin adapters. See
          [`docs/toolchain-compatibility.md`](docs/toolchain-compatibility.md).
          """
          if "## Compiler compatibility" not in readme_text:
              readme.write_text(
                  readme_text.rstrip() + section + "\n",
                  encoding="utf-8",
              )
          PY
          git diff --check

      - name: Verify ordinary C runtime with GCC
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-gcc -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc \
            -DCVITE_WARNINGS_AS_ERRORS=ON \
            -DCVITE_BUILD_COMPILER=OFF \
            -DCVITE_BUILD_LLVM_PASS=OFF \
            -DCVITE_BUILD_ORC_LOADER=OFF
          cmake --build build-gcc --verbose
          ctest --test-dir build-gcc --output-on-failure

      - name: Verify complete LLVM 18 pipeline
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-llvm18 -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCVITE_WARNINGS_AS_ERRORS=ON \
            -DCVITE_BUILD_COMPILER=ON \
            -DCVITE_BUILD_LLVM_PASS=ON \
            -DCVITE_BUILD_ORC_LOADER=ON \
            -DCVITE_LIBCLANG_ROOT=/usr/lib/llvm-18 \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          cmake --build build-llvm18 --verbose
          ctest --test-dir build-llvm18 --output-on-failure
          build-llvm18/cvite-llvm-adapter-info --json \
            | grep -F '"llvm_major":18'
          python3 scripts/cvite-doctor.py \
            --clang clang-18 \
            --llvm-config llvm-config-18 \
            --json \
            | grep -F '"compatible": true'

      - name: Verify sanitizers
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-sanitize -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined' \
            -DCVITE_WARNINGS_AS_ERRORS=ON \
            -DCVITE_BUILD_COMPILER=OFF \
            -DCVITE_BUILD_LLVM_PASS=OFF \
            -DCVITE_BUILD_ORC_LOADER=OFF
          cmake --build build-sanitize --verbose
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1 \
            ctest --test-dir build-sanitize --output-on-failure

      - name: Publish verified source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf -- .github/driver-next .github/instrumentation-next
          rm -f -- .github/workflows/implement-toolchain-adapters.yml

          # Remove superseded one-shot workflow machinery. Keep normal CI only.
          find .github/workflows -maxdepth 1 -type f \
            ! -name ci.yml \
            ! -name implement-toolchain-adapters.yml \
            -delete

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add LLVM adapters and managed allocation instrumentation [skip-managed-consolidation]"
          git fetch origin bootstrap/m0-runtime
          git rebase origin/bootstrap/m0-runtime
          git push origin HEAD:bootstrap/m0-runtime
