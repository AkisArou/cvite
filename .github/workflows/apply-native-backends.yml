name: Apply verified native-link backends

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'bootstrap/m0-runtime'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/m0-runtime
          fetch-depth: 0

      - name: Apply source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .cvite/native-backends.part-{00,01,02,03} > /tmp/native-backends.b64
          base64 -d /tmp/native-backends.b64 > /tmp/native-backends.tar.gz
          echo "2a9c2e8bb42bbb3e47238dbbb7f846be54775d76c76ed034bcdfcf533b817ccf  /tmp/native-backends.tar.gz" | sha256sum --check
          tar -xzf /tmp/native-backends.tar.gz -C .

          rm -f -- \
            .cvite/apply-auto-link.py \
            .cvite/apply-changed-filter.py \
            .cvite/auto-link-patch.tar.gz.b64 \
            .cvite/changed-functions/part-00 \
            .cvite/changed-functions/part-01 \
            .cvite/changed-functions/part-03 \
            .cvite/native-backends.part-00 \
            .cvite/native-backends.part-01 \
            .cvite/native-backends.part-02 \
            .cvite/native-backends.part-03 \
            .github/workflows/apply-auto-link.yml \
            .github/workflows/apply-changed-filter.yml \
            .github/workflows/cleanup-auto-link-workflows.yml \
            .github/workflows/finalize-auto-link-pr.yml \
            .github/workflows/recover-auto-link.yml \
            .github/workflows/verify-auto-link.yml \
            .github/workflows/export-auto-link-source.yml \
            .github/workflows/apply-native-backends.yml

          git diff --check

      - name: Install LLVM 18 development toolchain
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          ninja-build
          clang-18
          llvm-18
          llvm-18-dev
          libclang-18-dev
          python3
          cmake

      - name: Configure
        run: >-
          cmake -S . -B build-native -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCVITE_BUILD_COMPILER=ON
          -DCVITE_BUILD_LLVM_PASS=ON
          -DCVITE_BUILD_ORC_LOADER=ON
          -DCVITE_LIBCLANG_ROOT=/usr/lib/llvm-18
          -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          -DCVITE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build-native --verbose

      - name: Test
        run: ctest --test-dir build-native --output-on-failure

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            CMakeLists.txt \
            README.md \
            docs/dev-server.md \
            include/cvite/orc_loader.h \
            src/cli/native_link.cpp \
            src/cli/run.c \
            src/cli/run_internal.h \
            src/cli/watcher.c \
            src/host/orc_loader.cpp \
            tests/check_auto_link.py \
            tests/check_native_input_replacement.py \
            tests/check_native_link_backend.py \
            tests/fixtures/auto_link_app.c \
            tests/fixtures/auto_link_library.c \
            tests/fixtures/auto_link_library_next.c

          git rm --cached --ignore-unmatch \
            .cvite/apply-auto-link.py \
            .cvite/apply-changed-filter.py \
            .cvite/auto-link-patch.tar.gz.b64 \
            .cvite/changed-functions/part-00 \
            .cvite/changed-functions/part-01 \
            .cvite/changed-functions/part-03 \
            .cvite/native-backends.part-00 \
            .cvite/native-backends.part-01 \
            .cvite/native-backends.part-02 \
            .cvite/native-backends.part-03 \
            .github/workflows/apply-auto-link.yml \
            .github/workflows/apply-changed-filter.yml \
            .github/workflows/cleanup-auto-link-workflows.yml \
            .github/workflows/finalize-auto-link-pr.yml \
            .github/workflows/recover-auto-link.yml \
            .github/workflows/verify-auto-link.yml \
            .github/workflows/export-auto-link-source.yml \
            .github/workflows/apply-native-backends.yml

          git diff --cached --check
          git commit -m "feat: add CMake File API and Ninja native link discovery"
          git push origin HEAD:bootstrap/m0-runtime
